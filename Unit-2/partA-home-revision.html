var SORT3 = ["(blank)", "Ascending", "Descending"];
COURSE.days.push({
  id: "d6", n: 6, week: 2, short: "Queries: criteria",
  title: "Queries: criteria, sorting, AND / OR",
  activity: "Activity 3", time: "75–90 mins",
  intro: "Activity 3 asks you to build queries (and a report) that answer the client's questions. You can't run them in Access at home – so you'll do what the query does yourself: write the criteria, then scan the data row by row to predict the result. That's excellent practice: if you can predict the output, you understand the query.",
  blocks: [
    { t: "learn", title: "What Activity 3 asks", html:
      "<p>The brief gives a list of things the client wants to find out, e.g. <i>\"a list of learners who have not paid their deposit, in alphabetical order\"</i>. For each one you build a query, and you evidence the <b>Design View</b> (so the examiner sees your criteria) and the <b>results</b>.</p>" +
      "<p>Marks come from: the right <b>tables</b>, the right <b>fields</b> shown, the correct <b>criteria</b>, the right <b>sort</b>, and fields that aren't needed in the results having <b>Show</b> unticked.</p>" },

    { t: "learn", title: "The query design grid", html:
      QBE([{ f: "Learner Name", t: "tblLearner", s: "Ascending" }, { f: "Course Name", t: "tblCourse" }, { f: "Deposit Paid", t: "tblBooking", c: "No", sh: false }], "Example: learners who have not paid their deposit, A–Z") +
      "<ul><li><b>Field / Table</b> – what you're using and where it comes from.</li><li><b>Sort</b> – Ascending (A–Z, 0–9, oldest first) or Descending.</li><li><b>Show</b> – tick if it should appear in the results. Here Deposit Paid is only used to filter, so it's unticked.</li><li><b>Criteria</b> – the condition. <b>or</b> – an alternative condition.</li></ul>" },

    { t: "learn", title: "Criteria you must know", html:
      T(["To find…", "Criteria", "Notes"], [
        ["Exact text", "<code>\"Monday\"</code>", "Text in quotes (Access adds them if you forget)"],
        ["Not a value", "<code>Not \"Monday\"</code> or <code>&lt;&gt;\"Monday\"</code>", ""],
        ["Numbers", "<code>&gt;50</code> &nbsp; <code>&lt;=40</code>", "No £ sign"],
        ["A range", "<code>Between 45 And 55</code>", "Includes both ends"],
        ["Dates", "<code>Between #01/10/2025# And #31/10/2025#</code>", "Hashes round dates"],
        ["Before / after a date", "<code>&lt;#15/09/2025#</code> &nbsp; <code>&gt;=#01/10/2025#</code>", ""],
        ["Yes/No fields", "<code>Yes</code> or <code>No</code> (also True/False)", "No quotes"],
        ["Starts with S", "<code>Like \"S*\"</code>", "* = any number of characters"],
        ["Contains 'Pasta'", "<code>Like \"*Pasta*\"</code>", ""],
        ["Empty field", "<code>Is Null</code>", "<code>Is Not Null</code> for filled-in"],
        ["Ask the user each time (parameter)", "<code>[Enter course name]</code>", "Square brackets with a prompt"]]) },

    { t: "learn", title: "AND vs OR", html:
      "<p><b>Same row = AND.</b> Criteria on the same Criteria row must <i>all</i> be true. Chef Name <code>\"Rosa Bianchi\"</code> and Deposit Paid <code>No</code> on the same row → Rosa's courses <b>and</b> not paid.</p>" +
      "<p><b>Different rows = OR.</b> Put <code>\"Monday\"</code> on the Criteria row and <code>\"Wednesday\"</code> on the or row of Day → either day. In one cell you can write <code>\"Monday\" Or \"Wednesday\"</code> – same result.</p>" +
      "<p><b>Range on one field</b> uses And inside one cell: <code>&gt;=45 And &lt;=55</code>.</p>" },

    { t: "learn", title: "Which tables do I add?", html:
      "<p>Add every table that holds a field you need – <b>plus any table in between</b> that joins them. To list Chef Name next to Learner Name you need tblChef → tblCourse → tblBooking → tblLearner, even if you show no fields from tblCourse or tblBooking. Without the middle tables Access can't follow the relationships.</p>" },

    { t: "scenario", title: "Elmwood Cookery School – the data (from Day 2)", html: "<p>Use this data to predict what each query returns. It's the same data as Figure 1, now stored in four linked tables.</p>" + ELM.tables() + ELM.table() },

    { t: "h", text: "Practise – build and predict" },

    { t: "grid", qbe: true, q: "Query 1: <i>\"List the name of every learner who has <b>not paid</b> their deposit, and the course, in <b>alphabetical order of learner name</b>.\"</i> Fill in the blanks.", tag: "Query design grid",
      rows: [
        ["Field:", "Learner Name", "Course Name", "Deposit Paid"],
        ["Table:", "tblLearner", "tblCourse", "tblBooking"],
        ["Sort:", { sel: SORT3, a: "Ascending" }, { sel: SORT3, a: "(blank)" }, { sel: SORT3, a: "(blank)" }],
        ["Criteria:", "", "", { accept: ["No", "False", "0"], show: "No" }]],
      why: "Deposit Paid = <code>No</code> (no quotes – it's a Yes/No field). Sort Learner Name Ascending. In Access you'd also untick Show for Deposit Paid, since it's only used as a filter." },

    { t: "text", mode: "num", q: "How many records will Query 1 return?", accept: ["4"], why: "Rows 2, 6, 8 and 10: Grace Kim (Italian Basics), Finn O'Neill (Curry Masterclass), Omar Haddad (Sushi Skills), Zara Ahmed (Fresh Pasta)." },
    { t: "mcq", q: "Which learner appears <b>first</b> in Query 1's results?", opts: ["Grace Kim", "Finn O'Neill", "Omar Haddad", "Zara Ahmed"], a: 1, why: "Ascending by Learner Name: <b>F</b>inn, <b>G</b>race, <b>O</b>mar, <b>Z</b>ara. (Access sorts on the first letter of the whole field – here the first name.)" },

    { t: "text", mode: "expr", q: "Query 2: <i>\"Find bookings for courses costing <b>more than £50</b>.\"</i> Criteria for Course Price?", accept: [">50"], why: "<code>&gt;50</code> – no £ sign, and 'more than' means 50 itself is excluded." },
    { t: "text", mode: "num", q: "How many <b>bookings</b> does Query 2 return?", accept: ["5"], why: "Curry Masterclass (£55) has 3 bookings and Sushi Skills (£60) has 2 → 5. Fresh Pasta at exactly £50 is <i>not</i> more than £50." },

    { t: "text", mode: "expr", q: "Query 3: <i>\"Show all bookings made in <b>October 2025</b>.\"</i> Criteria for Booking Date?", accept: ["Between #01/10/2025# And #31/10/2025#", ">=#01/10/2025# And <=#31/10/2025#", "Between #1/10/2025# And #31/10/2025#", ">=#01/10/2025# And <#01/11/2025#"], show: "Between #01/10/2025# And #31/10/2025#",
      near: [{ re: /between"?01\/10\/2025"?and"?31\/10\/2025"?$/, msg: "Dates need hashes: <code>#01/10/2025#</code>." }],
      why: "<code>Between #01/10/2025# And #31/10/2025#</code>." },
    { t: "text", mode: "num", q: "How many records does Query 3 return?", accept: ["5"], why: "01/10, 02/10, 06/10, 14/10 and 20/10 – rows 6 to 10." },

    { t: "mcq", q: "Query 4: <i>\"Show Rosa Bianchi's bookings where the deposit has <b>not</b> been paid.\"</i> How do you set the criteria?", opts: ["\"Rosa Bianchi\" on the Criteria row of Chef Name, and No on the <b>or</b> row of Deposit Paid", "\"Rosa Bianchi\" and No both on the <b>same</b> Criteria row", "\"Rosa Bianchi\" And No in the Chef Name column", "Two separate queries"], a: 1,
      why: "Both conditions must be true → same row = AND. Putting No on the 'or' row would return all of Rosa's bookings plus every unpaid booking." },
    { t: "text", mode: "num", q: "How many records does Query 4 return?", accept: ["2"], why: "Rosa runs K01 and K02. Unpaid bookings on those: Grace Kim on Italian Basics, Zara Ahmed on Fresh Pasta → 2." },
    { t: "multi", q: "Query 4 shows Chef Name and Learner Name. Which tables must be in the query?", opts: ["tblChef", "tblCourse", "tblBooking", "tblLearner"], a: [0, 1, 2, 3],
      why: "All four. tblCourse and tblBooking hold the links between chef and learner (and Deposit Paid is in tblBooking)." },

    { t: "text", mode: "expr", q: "Query 5: <i>\"Bookings for courses that run on a <b>Monday or a Wednesday</b>.\"</i> Write the criteria for Day in <b>one cell</b>.", accept: ["\"Monday\" Or \"Wednesday\"", "\"Wednesday\" Or \"Monday\"", "In (\"Monday\",\"Wednesday\")", "=\"Monday\" Or =\"Wednesday\""], show: "\"Monday\" Or \"Wednesday\"",
      near: [{ re: /"monday"and"wednesday"/, msg: "A course can't be on Monday AND Wednesday at the same time – you need <b>Or</b>." }],
      why: "<code>\"Monday\" Or \"Wednesday\"</code>. (Or put each on a separate row.)" },
    { t: "text", mode: "num", q: "How many records does Query 5 return?", accept: ["4"], why: "Italian Basics (Monday) × 2 and Fresh Pasta (Wednesday) × 2 → 4." },

    { t: "text", mode: "expr", q: "Query 6: <i>\"Bookings for any course whose name <b>starts with S</b>.\"</i> Criteria for Course Name?", accept: ["Like \"S*\""], near: [{ re: /^"s\*"$|^s\*$/, msg: "Wildcards need <code>Like</code> in front." }], why: "<code>Like \"S*\"</code> → Sushi Skills (2 bookings)." },

    { t: "text", mode: "num", q: "Query 7: Course Price criteria <code>Between 45 And 55</code>. How many <b>bookings</b> are returned?", accept: ["7"], why: "£45 (2 bookings), £50 (2) and £55 (3) – Between includes both ends → 7. Only Sushi Skills (£60) and Baking Bread (£40) are left out." },

    { t: "mcq", q: "Query 8: the client wants to type in any course name each time the query runs. What goes in the Criteria for Course Name?", opts: ["<code>\"Course Name\"</code>", "<code>[Enter the course name]</code>", "<code>Like *</code>", "<code>Is Null</code>"], a: 1,
      why: "Square brackets with a prompt make a <b>parameter query</b>: Access pops up a box asking for the value." },

    { t: "grid", qbe: true, q: "Query 9: <i>\"Which <b>Tuesday</b> courses are run by <b>Dev Sharma</b>? Show the course name only.\"</i>", tag: "Query design grid",
      rows: [
        ["Field:", "Course Name", "Day", "Chef Name"],
        ["Table:", "tblCourse", "tblCourse", "tblChef"],
        ["Show:", { sel: ["☑ ticked", "☐ unticked"], a: "☑ ticked" }, { sel: ["☑ ticked", "☐ unticked"], a: "☐ unticked" }, { sel: ["☑ ticked", "☐ unticked"], a: "☐ unticked" }],
        ["Criteria:", "", { accept: ["\"Tuesday\"", "Tuesday"], show: "\"Tuesday\"" }, { accept: ["\"Dev Sharma\"", "Dev Sharma"], show: "\"Dev Sharma\"" }]],
      why: "'Show the course name only' → untick Day and Chef Name. They're still in the grid because they hold the criteria. Result: Curry Masterclass." },

    { t: "mcq", q: "What does an <b>unticked Show</b> box do?", opts: ["Deletes the field", "Uses the field (e.g. for criteria or sorting) but hides it from the results", "Sorts the field", "Makes the criteria optional"], a: 1, why: "Examiners check this: if the brief asks for specific fields, only those should appear." },

    { t: "mcq", q: "You want learners who have <b>no phone number</b> recorded. Criteria for Learner Phone?", opts: ["<code>0</code>", "<code>\"\"</code>", "<code>Is Null</code>", "<code>No</code>"], a: 2, why: "<code>Is Null</code> finds empty fields. <code>Is Not Null</code> finds filled-in ones." },

    { t: "mcq", q: "A student writes <code>&gt;£50</code> as the criteria for Course Price. What happens?", opts: ["Works fine", "Access gives an error / won't match – criteria for a currency field should be just <code>&gt;50</code>", "Returns prices in pounds only", "Sorts the prices"], a: 1, why: "Leave out currency symbols and units in criteria." },

    { t: "tip", title: "Exam habit", html: "<p>Before you screenshot, run the query and <b>check the results against the data</b> exactly like you've done today. If Query 2 returned Fresh Pasta, you'd know you'd typed <code>&gt;=50</code> by mistake.</p>" }
  ]
});

var TOT = ["Group By", "Count", "Sum", "Avg", "Max", "Min", "Where"];
COURSE.days.push({
  id: "d7", n: 7, week: 2, short: "Calculations, totals & reports",
  title: "Calculated fields, IIf, totals queries and reports",
  activity: "Activity 3", time: "90 mins",
  intro: "The harder half of Activity 3: working things out (VAT, discounts, amounts owed), making decisions with IIf, counting and adding up with a Totals query, and presenting it all in a grouped report.",
  blocks: [
    { t: "learn", title: "Calculated fields", html:
      "<p>In an empty <b>Field</b> cell of the query grid type <b>NewName: expression</b>. Field names go in <b>[square brackets]</b>.</p>" +
      T(["Need", "Type in the Field row"], [
        ["VAT at 20%", "<code>VAT: [Course Price]*0.2</code>"],
        ["Price including VAT", "<code>Price Inc VAT: [Course Price]*1.2</code>"],
        ["10% discount", "<code>Discounted Price: [Course Price]*0.9</code>"],
        ["Price minus a £15 deposit", "<code>Balance: [Course Price]-15</code>"],
        ["Two fields multiplied", "<code>Total Cost: [Price]*[Quantity]</code>"]]) +
      "<p>The name before the colon becomes the column heading. Set the field's <b>Format</b> property to <b>Currency</b> so it shows £ and 2 decimal places.</p>" +
      "<p><b>Percentages:</b> 20% of x = <code>x*0.2</code>. x after a 10% discount = <code>x*0.9</code>. x after a 15% discount = <code>x*0.85</code>.</p>" },

    { t: "learn", title: "IIf – making a decision", html:
      "<p><code>IIf( test , value if true , value if false )</code></p>" +
      "<p><code>Status: IIf([Deposit Paid]=Yes,\"Confirmed\",\"Reserved\")</code> → every paid booking shows <i>Confirmed</i>, every unpaid one <i>Reserved</i>.</p>" +
      "<p><code>Amount Owed: IIf([Deposit Paid]=Yes,[Course Price]-15,[Course Price])</code> → if they've paid the £15 deposit they owe the price minus 15, otherwise the full price.</p>" +
      "<p>Watch the details: two <b>I</b>s in IIf; commas between the three parts; text results in quotes; numbers and field names not in quotes.</p>" },

    { t: "learn", title: "Totals queries – Count, Sum, Avg", html:
      "<p>Press <b>Totals (Σ)</b> in Design View and a <b>Total</b> row appears. Use <b>Group By</b> on the field you're grouping by and an aggregate on the field you're counting or adding.</p>" +
      QBE([{ f: "Course Name", t: "tblCourse", tot: "Group By" }, { f: "Learner ID", t: "tblBooking", tot: "Count", c: "&gt;=2" }], "Example: courses with at least 2 bookings") +
      T(["The brief says…", "Total row"], [["\"how many…\", \"number of…\"", "Count"], ["\"total…\" (money, quantities)", "Sum"], ["\"average…\"", "Avg"], ["\"highest / most expensive\"", "Max"], ["\"lowest / cheapest\"", "Min"]]) +
      "<p>Criteria on the Count column (<code>&gt;=2</code>) filters the <b>groups</b> – e.g. 'courses with at least 2 bookings'.</p>" },

    { t: "learn", title: "Reports – bands and what goes where", html:
      T(["Band", "Appears", "Put here"], [
        ["Report Header", "Once, at the very start", "The report title"],
        ["Page Header", "Top of every page", "Column headings"],
        ["Group Header", "Before each group", "The group name, e.g. each Course Name"],
        ["Detail", "Once per record", "The data lines, e.g. each learner"],
        ["Group Footer", "After each group", "Group totals: <code>=Count(*)</code>, <code>=Sum([Course Price])</code>"],
        ["Page Footer", "Bottom of every page", "Page numbers, date"],
        ["Report Footer", "Once, at the very end", "Grand totals"]]) +
      "<p>The <b>Report Wizard</b> builds most of this: choose the query, pick a <b>grouping</b> level, a <b>sort</b> order, and <b>Summary Options</b> (Sum/Avg/Min/Max). Then tidy it in Design/Layout View.</p>" +
      "<p><b>Marks are lost for:</b> a default title like 'qryBookings1', cut-off data or headings (#### or half-visible text), missing grouping/sort that the brief asked for, and totals without a label.</p>" },

    { t: "scenario", title: "Elmwood data (again)", html: ELM.table() },

    { t: "h", text: "Practise – calculated fields and IIf", sub: "Type the expression. You can include the name and colon (e.g. VAT: …) or just the calculation." },

    { t: "text", mode: "calc", q: "Show the <b>VAT at 20%</b> on each Course Price.", accept: ["[Course Price]*0.2", "[Course Price]*20/100", "[Course Price]*0.20", "[Course Price]/5", "0.2*[Course Price]", "[Course Price]*20%", "[Course Price]*(20/100)"], show: "VAT: [Course Price]*0.2",
      why: "<code>VAT: [Course Price]*0.2</code>" },
    { t: "text", mode: "num", q: "What VAT would be shown for <b>Sushi Skills</b> (£60.00)?", accept: ["12"], why: "60 × 0.2 = £12.00" },
    { t: "text", mode: "calc", q: "Show each course's price after a <b>10% discount</b>.", accept: ["[Course Price]*0.9", "[Course Price]*90/100", "[Course Price]-[Course Price]*0.1", "[Course Price]-([Course Price]*0.1)", "[Course Price]*0.90", "0.9*[Course Price]", "[Course Price]-[Course Price]*10/100", "[Course Price]*90%"], show: "Discounted Price: [Course Price]*0.9",
      near: [{ re: /^courseprice\*0\.1$/, msg: "That's the discount <i>amount</i> (10% of the price). The price <i>after</i> the discount is 90% of it." }],
      why: "Price after 10% off = 90% of the price → <code>[Course Price]*0.9</code>." },
    { t: "text", mode: "num", q: "What is the discounted price of <b>Fresh Pasta</b> (£50.00)?", accept: ["45"], why: "50 × 0.9 = £45.00" },

    { t: "text", mode: "calc", q: "Add a field called <b>Status</b> that shows <b>Confirmed</b> if the deposit has been paid and <b>Reserved</b> if not.", accept: ["IIf([Deposit Paid]=Yes,\"Confirmed\",\"Reserved\")", "IIf([Deposit Paid]=True,\"Confirmed\",\"Reserved\")", "IIf([Deposit Paid]=-1,\"Confirmed\",\"Reserved\")", "IIf([Deposit Paid],\"Confirmed\",\"Reserved\")", "IIf([Deposit Paid]=No,\"Reserved\",\"Confirmed\")", "IIf([Deposit Paid]=False,\"Reserved\",\"Confirmed\")", "IIf([Deposit Paid]=0,\"Reserved\",\"Confirmed\")", "IIf([Deposit Paid]<>No,\"Confirmed\",\"Reserved\")"], show: "Status: IIf([Deposit Paid]=Yes,\"Confirmed\",\"Reserved\")",
      near: [{ re: /^if\(/, msg: "It's <b>IIf</b> – two I's." }, { re: /confirmed,reserved/, msg: "Text results need quotes: <code>\"Confirmed\"</code>." }],
      why: "<code>Status: IIf([Deposit Paid]=Yes,\"Confirmed\",\"Reserved\")</code>" },
    { t: "text", mode: "num", q: "How many bookings would show <b>Reserved</b>?", accept: ["4"], why: "4 bookings have Deposit Paid = No." },

    { t: "text", mode: "calc", q: "The deposit is £15. Add <b>Amount Owed</b>: if the deposit has been paid, the course price minus 15; otherwise the full course price.", accept: ["IIf([Deposit Paid]=Yes,[Course Price]-15,[Course Price])", "IIf([Deposit Paid]=True,[Course Price]-15,[Course Price])", "IIf([Deposit Paid],[Course Price]-15,[Course Price])", "IIf([Deposit Paid]=No,[Course Price],[Course Price]-15)", "IIf([Deposit Paid]=-1,[Course Price]-15,[Course Price])", "IIf([Deposit Paid]=False,[Course Price],[Course Price]-15)"], show: "Amount Owed: IIf([Deposit Paid]=Yes,[Course Price]-15,[Course Price])",
      why: "<code>Amount Owed: IIf([Deposit Paid]=Yes,[Course Price]-15,[Course Price])</code>" },
    { t: "grid", q: "Predict <b>Amount Owed</b> for these bookings.", head: ["Booking", "Course Price", "Deposit Paid", "Amount Owed (£)"],
      rows: [["Omar Haddad – Italian Basics", "£45.00", "Yes", { accept: ["30"], mode: "num" }], ["Omar Haddad – Sushi Skills", "£60.00", "No", { accept: ["60"], mode: "num" }], ["Finn O'Neill – Baking Bread", "£40.00", "Yes", { accept: ["25"], mode: "num" }], ["Zara Ahmed – Fresh Pasta", "£50.00", "No", { accept: ["50"], mode: "num" }]],
      why: "Paid → price − 15. Not paid → full price." },
    { t: "text", mode: "num", q: "Across <b>both</b> of Grace Kim's bookings, how much does she owe in total?", accept: ["85"], why: "Italian Basics, not paid → £45. Curry Masterclass, paid → £55 − £15 = £40. Total £85." },

    { t: "h", text: "Practise – totals queries" },

    { t: "grid", qbe: true, q: "<i>\"How many bookings does each course have? Only show courses with <b>at least 2</b> bookings.\"</i>", tag: "Query design grid",
      rows: [["Field:", "Course Name", "Learner ID"], ["Table:", "tblCourse", "tblBooking"], ["Total:", { sel: TOT, a: "Group By" }, { sel: TOT, a: "Count" }], ["Criteria:", "", { accept: [">=2", ">1"], show: ">=2" }]],
      why: "Group By the course, Count the bookings, and put <code>&gt;=2</code> on the Count column." },
    { t: "grid", q: "Predict the number of bookings for each course.", head: ["Course Name", "Bookings"],
      rows: [["Italian Basics", { accept: ["2"], mode: "num" }], ["Fresh Pasta", { accept: ["2"], mode: "num" }], ["Curry Masterclass", { accept: ["3"], mode: "num" }], ["Sushi Skills", { accept: ["2"], mode: "num" }], ["Baking Bread", { accept: ["1"], mode: "num" }]],
      why: "So the 'at least 2' query returns 4 courses – everything except Baking Bread." },
    { t: "mcq", q: "<i>\"Show the <b>total income</b> from bookings for each chef.\"</i> Which Total setting goes on Course Price?", opts: ["Count", "Sum", "Avg", "Max"], a: 1, why: "'Total' money → Sum, with Group By on Chef Name." },
    { t: "text", mode: "num", q: "What total income would that query show for <b>Rosa Bianchi</b>?", accept: ["190"], why: "Rosa's bookings: Italian Basics £45 × 2 + Fresh Pasta £50 × 2 = £190." },
    { t: "mcq", q: "<i>\"What is the <b>average</b> price of a course?\"</i> (using tblCourse only). What's the answer?", opts: ["£48.00", "£50.00", "£51.50", "£55.00"], a: 1, why: "Avg of 45, 50, 55, 60, 40 = 250 ÷ 5 = £50.00. (If you averaged over the 10 bookings instead you'd get £51.50 – read the question carefully: per course or per booking?)" },
    { t: "mcq", q: "<i>\"Which course is the <b>most expensive</b>?\"</i> One good approach is…", opts: ["Count on Course Price", "Sort Course Price Descending (and show the top value), or use Max", "Group By Course Price", "Criteria <code>&gt;Max</code>"], a: 1, why: "Sort descending puts the most expensive first; a Totals query with Max gives the highest price." },

    { t: "h", text: "Practise – reports" },

    { t: "match", q: "Which report band does each item belong in?", lh: "Item", rh: "Band",
      items: [["The title 'Elmwood Bookings by Course'", "Report Header"], ["Column headings shown at the top of every page", "Page Header"], ["Each course name, as a heading above its learners", "Group Header"], ["One line for each learner's booking", "Detail"], ["The number of bookings for each course", "Group Footer"], ["Page 1 of 2", "Page Footer"], ["The grand total of all bookings", "Report Footer"]],
      choices: ["Report Header", "Page Header", "Group Header", "Detail", "Group Footer", "Page Footer", "Report Footer"],
      why: "Group bands repeat for every group; Report bands appear once; Page bands appear on every page." },
    { t: "text", mode: "expr", q: "What would you type in a text box in the <b>Group Footer</b> to count the bookings in each course?", accept: ["Count(*)", "Count([Learner ID])", "Count([Learner Name])", "Count([Course ID])", "Count([Booking Date])"], show: "=Count(*)",
      why: "<code>=Count(*)</code> (or <code>=Count([Learner ID])</code>). The same expression in the Report Footer gives the grand total." },
    { t: "text", mode: "num", q: "What grand total would the Report Footer show?", accept: ["10"], why: "10 bookings altogether." },
    { t: "text", mode: "expr", q: "Write the expression for a text box that adds up the <b>Course Price</b> of every booking in a group.", accept: ["Sum([Course Price])"], show: "=Sum([Course Price])", why: "<code>=Sum([Course Price])</code> – in the Report Footer it would show £515.00 in total." },
    { t: "multi", q: "Which of these would lose marks on a report?", opts: ["The title is left as 'qryBookingsByCourse'", "Some learner names are cut off", "Grouped by course, as the brief asked", "A group total with no label next to it", "Sorted by learner name within each course"], a: [0, 1, 3],
      why: "Give it a meaningful title, make sure every value is fully visible, and label every total ('Number of bookings:')." },

    { t: "tip", title: "Tomorrow", html: "<p>Activity 4 – testing. You'll design test data for the validation you wrote on Day 4. Have a quick look back at your Day 4 answers first.</p>" }
  ]
});

var TYPES = ["Normal", "Extreme", "Erroneous"];
var RES = ["Accepted", "Rejected"];
COURSE.days.push({
  id: "d8", n: 8, week: 2, short: "Testing",
  title: "Testing the database structure",
  activity: "Activity 4", time: "60–75 mins",
  intro: "Activity 4 asks you to prove your structure and validation actually work. That means choosing the right test data, predicting what should happen, and recording what did happen. All of the thinking can be practised without Access.",
  blocks: [
    { t: "learn", title: "What Activity 4 asks", html:
      "<p>You test the things you set up in Activity 2 – validation rules, input masks, lookups, required fields, primary keys and relationships. For each test you record a row in a <b>test plan / test log</b> and take a screenshot as evidence (usually the error message).</p>" +
      T(["Test no.", "What is being tested", "Test data", "Type of test", "Expected result", "Actual result"], [
        ["1", "Climber Age validation rule <code>&gt;=8</code>", "12", "Normal", "Accepted – record saves", "As expected"],
        ["2", "Climber Age validation rule <code>&gt;=8</code>", "8", "Extreme", "Accepted – record saves", "As expected"],
        ["3", "Climber Age validation rule <code>&gt;=8</code>", "7", "Erroneous", "Rejected – message 'Climbers must be 8 or over' appears", "As expected (screenshot 4.3)"]]) },

    { t: "learn", title: "Normal, extreme, erroneous", html:
      T(["Type", "Meaning", "For <code>Between 16 And 99</code>"], [
        ["<b>Normal</b>", "Sensible, valid data in the middle of the range. Should be <b>accepted</b>.", "30, 45"],
        ["<b>Extreme</b> (boundary)", "Valid data right <b>on the edge</b> of what's allowed. Should be <b>accepted</b>.", "16 and 99"],
        ["<b>Erroneous</b>", "Invalid data – outside the range or the wrong type. Should be <b>rejected</b>.", "15, 100, 'abc'"]]) +
      "<p>Good test plans test <b>both</b> boundaries, and the value <b>just outside</b> each one (15 and 100). That's where mistakes like <code>&gt;</code> instead of <code>&gt;=</code> get caught.</p>" },

    { t: "learn", title: "Testing everything else", html:
      T(["What you're testing", "Erroneous test", "Expected result"], [
        ["Input mask <code>\\C\\L000</code>", "Type CL12 (too few digits) or try a letter in a digit position", "Rejected – Access won't let you leave the field / 'The value you entered isn't appropriate for the input mask'"],
        ["Required = Yes", "Leave the field blank and save", "Rejected – 'You must enter a value…'"],
        ["Value List, Limit To List = Yes", "Type 'Expert' in Session Level", "Rejected – 'The text you entered isn't an item in the list'"],
        ["Primary key", "Enter an ID that already exists (e.g. a second CL001)", "Rejected – duplicate values in the primary key"],
        ["Composite key on a link table", "Enter the same Climber ID + Session ID pair twice", "Rejected – duplicate key"],
        ["Referential integrity", "Enter a Session ID in tblAttendance that isn't in tblSession (e.g. SE99)", "Rejected – 'a related record is required in tblSession'"]]) +
      "<p><b>Expected result</b> must say <b>accepted or rejected AND what you'll see</b> – e.g. the validation text you wrote. 'It works' gets nothing.</p>" },

    { t: "h", text: "Practise" },

    { t: "match", q: "The rule is <code>Between 1 And 20</code>. What type of test is each value?", lh: "Test data", rh: "Type",
      items: [["10", "Normal"], ["1", "Extreme"], ["20", "Extreme"], ["0", "Erroneous"], ["21", "Erroneous"], ["ten", "Erroneous"]], choices: TYPES,
      why: "1 and 20 are valid but on the boundary → extreme. 0 and 21 are just outside → erroneous. Text in a number field is erroneous too." },
    { t: "text", mode: "num", q: "The rule on Climber Age is <code>&gt;=8</code>. What is the <b>extreme</b> test value?", accept: ["8"], why: "8 is the lowest value that should still be accepted." },
    { t: "text", mode: "num", q: "…and the <b>erroneous</b> value just outside that boundary?", accept: ["7"], why: "7 should be rejected. If 8 is rejected too, the rule was probably written as &gt;8 by mistake." },

    { t: "grid", q: "Complete the expected results for the Course Price rule <code>Between 20 And 100</code>.", head: ["Test data", "Type of test", "Expected result"],
      rows: [["£55", { sel: TYPES, a: "Normal" }, { sel: RES, a: "Accepted" }], ["£20", { sel: TYPES, a: "Extreme" }, { sel: RES, a: "Accepted" }], ["£100", { sel: TYPES, a: "Extreme" }, { sel: RES, a: "Accepted" }], ["£19.99", { sel: TYPES, a: "Erroneous" }, { sel: RES, a: "Rejected" }], ["£100.01", { sel: TYPES, a: "Erroneous" }, { sel: RES, a: "Rejected" }]],
      why: "Extreme values are accepted; erroneous values are rejected and the validation text appears." },

    { t: "match", q: "Today's date is 01/03/2026 and Booking Date has the rule <code>&gt;=Date()</code>. Classify each test.", lh: "Test data", rh: "Type",
      items: [["15/03/2026", "Normal"], ["01/03/2026", "Extreme"], ["28/02/2026", "Erroneous"]], choices: TYPES,
      why: "Today is the boundary (accepted). Yesterday is just outside it (rejected)." },

    { t: "mcq", q: "Input mask <code>\\C\\L000</code> on Climber ID. Which is a good <b>erroneous</b> test?", opts: ["CL123", "CL12 – only two digits", "CL000", "CL999"], a: 1,
      why: "CL12 doesn't fill the required digits, so Access won't accept it. CL123, CL000 and CL999 all fit the mask and should be accepted (an input mask checks the shape, not whether the number is sensible)." },
    { t: "mcq", q: "Session Level is a Value List (Beginner; Improver; Advanced) with Limit To List = Yes. What happens if you type <b>Expert</b>?", opts: ["Accepted – it's text", "Rejected – Access says the text isn't an item in the list", "Accepted, but shown in red", "Access adds Expert to the list"], a: 1,
      why: "That's exactly what Limit To List = Yes is for. If it were No, Expert would be accepted – a good reason to test it." },
    { t: "mcq", q: "You try to add a record to tblAttendance with Session ID <b>SE99</b>, which doesn't exist in tblSession. Referential integrity is enforced. Expected result?", opts: ["Accepted", "Rejected – a related record is required in tblSession", "Accepted, but SE99 is added to tblSession", "The relationship is deleted"], a: 1,
      why: "Referential integrity stops 'orphan' records – you can't attend a session that doesn't exist." },
    { t: "mcq", q: "You enter <b>CL001 + SE01</b> into tblAttendance, but that pair is already there. Expected result?", opts: ["Accepted – it's a second attendance", "Rejected – duplicate value in the (composite) primary key", "Accepted only if Belay Check Passed is different", "Access asks which one to keep"], a: 1,
      why: "This test proves your composite key is doing its job." },
    { t: "mcq", q: "You try to delete instructor <b>I01</b>, who still has sessions in tblSession. With referential integrity on (no cascade delete), what happens?", opts: ["I01 is deleted and their sessions remain", "Rejected – the record can't be deleted because related records exist in tblSession", "I01 and all their sessions are deleted", "Nothing happens and no message appears"], a: 1,
      why: "Referential integrity also protects the 'one' side: you can't leave sessions pointing to an instructor who no longer exists." },
    { t: "mcq", q: "Which test is the right way to check <b>Required = Yes</b> on Climber Name?", opts: ["Type a very long name", "Leave Climber Name empty and try to save the record", "Type a number in Climber Name", "Type the name in capitals"], a: 1, why: "A presence check is tested by leaving the field blank." },

    { t: "mcq", q: "Which is the <b>best</b> expected result for an erroneous test of Climber Age (value 7)?", opts: ["It works", "Error", "Rejected – the message 'Climbers must be aged 8 or over' is displayed and the record isn't saved", "7"], a: 2,
      why: "Say whether it's accepted or rejected, and quote what should appear." },
    { t: "multi", q: "What should every row of a good test plan include?", opts: ["What is being tested (field and check)", "The test data", "The type of test (normal/extreme/erroneous)", "The expected result", "The actual result (with evidence)", "Your target grade"], a: [0, 1, 2, 3, 4],
      why: "And if actual ≠ expected, record what you changed and re-test." },
    { t: "mcq", q: "Your extreme test (value 8) is <b>rejected</b> but should have been accepted. What should you do?", opts: ["Change the expected result to 'Rejected'", "Ignore it", "Record it, fix the rule (it was probably <code>&gt;8</code>) and re-test, recording the new result", "Delete the test"], a: 2,
      why: "Finding and fixing a fault is good practice – and it shows the examiner your testing actually did something." },

    { t: "grid", q: "Write a mini test plan for the Member ID input mask <code>\\M00</code> (letter M then two digits). Choose the type and expected result for each.", head: ["Test data", "Type of test", "Expected result"],
      rows: [["M07", { sel: TYPES, a: "Normal" }, { sel: RES, a: "Accepted" }], ["M7", { sel: TYPES, a: "Erroneous" }, { sel: RES, a: "Rejected" }], ["M00", { sel: TYPES, a: "Extreme" }, { sel: RES, a: "Accepted" }], ["M99", { sel: TYPES, a: "Extreme" }, { sel: RES, a: "Accepted" }], ["MAB", { sel: TYPES, a: "Erroneous" }, { sel: RES, a: "Rejected" }]],
      why: "M00 and M99 are the lowest and highest values the mask can take. M7 is too short and MAB has letters where digits are required." },

    { t: "tip", title: "Remember the screenshots", html: "<p>For each erroneous test, the evidence is a screenshot of the <b>error message</b>, ideally with the data you typed still visible. Number the screenshots so the test log can refer to them.</p>" }
  ]
});

COURSE.days.push({
  id: "d9", n: 9, week: 2, short: "Writing the evaluation",
  title: "Activity 5: writing a top-band evaluation",
  activity: "Activity 5", time: "75–90 mins",
  intro: "Activity 5 is a written evaluation, usually worth 6 marks and marked in levels (bands) – not one mark per point. Today you'll learn what lifts an answer from the bottom band to the top, then write two full answers and mark them against a checklist and a model.",
  blocks: [
    { t: "learn", title: "How it's marked", html:
      "<p>The examiner reads the whole answer and places it in a <b>band</b>:</p>" +
      T(["Band", "Roughly what it looks like"], [
        ["Low (1–2)", "Lists or describes what was done ('I made four tables and used validation'). Generic. Little or no 'why'."],
        ["Middle (3–4)", "Explains some features and why they help, with some reference to the scenario. May be one-sided (only strengths)."],
        ["Top (5–6)", "Evaluates: each point names a <b>specific feature of your design</b>, explains <b>how it meets a specific requirement</b> of the client, and the answer is <b>balanced</b> – it also considers limitations or improvements. Correct technical vocabulary throughout."]]) +
      "<p>The key difference: <b>describe</b> = what you did. <b>Evaluate</b> = how well it meets the client's needs, and what its limits are.</p>" },

    { t: "learn", title: "Build every point the same way", html:
      "<ol><li><b>Feature</b> – name it precisely: <i>'the composite primary key (Climber ID + Session ID) in tblAttendance'</i>.</li>" +
      "<li><b>Requirement</b> – which of the client's needs does it meet? <i>'…so each climber's attendance at each session is recorded once…'</i></li>" +
      "<li><b>Impact</b> – why that matters: <i>'…which stops duplicate records and makes the belay check results reliable.'</i></li>" +
      "<li><b>Limitation / improvement</b> (at least once in the answer): <i>'However, the input mask only checks the format of the phone number, not that it is the instructor's real number.'</i></li></ol>" +
      "<p><b>What to cover</b> (pick the ones the question asks about): splitting the flat file to remove duplication and anomalies; the link table and composite key; foreign keys and referential integrity; data types and field sizes; each validation check and the error it prevents; limitations of validation.</p>" },

    { t: "learn", title: "Weak vs strong", html:
      "<p><b>Weak:</b> <i>\"My database is good because I used validation and it has four tables. I used an input mask. This makes it accurate.\"</i></p>" +
      "<p>Why it's weak: no named fields or tables, no link to a requirement, 'accurate' isn't explained, no limitation.</p>" +
      "<p><b>Strong:</b> <i>\"The input mask <code>\\C\\L000</code> on Climber ID forces every ID to be 'CL' followed by exactly three digits, which meets the centre's requirement for a consistent ID format and stops typing errors such as 'C001' being saved. However, it only checks the format: it cannot stop a receptionist giving a new climber an ID that is already in use – that is prevented by Climber ID being the primary key.\"</i></p>" },

    { t: "tip", title: "Useful sentence starters", html: "<ul><li>\"This meets the requirement that … because …\"</li><li>\"Without this, … could happen, for example …\"</li><li>\"This is an improvement on the flat file because …\"</li><li>\"However, a limitation is …\" / \"This could be improved by …\"</li><li>\"Overall, the structure is effective because …, although …\"</li></ul>" },

    { t: "mcq", q: "Which sentence would earn the most credit?", opts: ["\"I used a composite key.\"", "\"The database has a link table which is good.\"", "\"tblBooking uses Learner ID + Course ID as a composite primary key, so a learner cannot be booked onto the same course twice, meeting the school's need for accurate booking records.\"", "\"Composite keys are made of two fields.\""], a: 2,

    { t: "scenario", title: "Question 1 – Elmwood Cookery School (structure)", html:
      "<p>Use your Elmwood design from Day 2:</p>" + ELM.tables() +
      "<p><b>Evaluate how well your database structure meets Elmwood's requirements.</b> Elmwood needs to: store each chef, course and learner without repeating details; record every booking, including the date and whether the deposit was paid; and make sure a learner cannot be booked onto the same course twice. <i>(6 marks)</i></p>" },
    { t: "essay", minWords: 150, q: "Write your evaluation of the Elmwood database structure.", check: [
      "I explained that splitting the flat file means details (e.g. a learner's phone, a chef's name) are stored once, with an example",
      "I named an anomaly (update, insertion or deletion) the structure prevents",
      "I explained the link table tblBooking and why it's needed (learners ↔ courses is many-to-many)",
      "I explained that the composite key (Learner ID + Course ID) stops a learner being booked onto the same course twice",
      "I explained why Booking Date and Deposit Paid are in tblBooking (they're facts about each booking)",
      "I included at least one limitation or improvement (e.g. a learner can't rebook the same course later without a different key design; referential integrity must be enforced for the links to be reliable)"],
      model: "<p>Splitting Figure 1 into tblChef, tblCourse, tblLearner and tblBooking means each chef, course and learner is stored once. For example, Omar Haddad's phone number was repeated on three rows of the flat file; now it is in one record in tblLearner, so if it changes it only needs updating once, which prevents update anomalies. A new course can also be added to tblCourse before anyone books it, avoiding an insertion anomaly.</p><p>Learners can book several courses and each course has several learners, which is many-to-many, so I added the link table tblBooking. Its composite primary key, Learner ID + Course ID, means Access will reject a second booking for the same learner on the same course, meeting the requirement directly – an AutoNumber key would not have prevented this. Booking Date and Deposit Paid are stored in tblBooking because they belong to each booking, not to the learner or course (Omar has paid for Italian Basics but not Sushi Skills). Chef ID is a foreign key in tblCourse, linking each course to its one chef.</p><p>However, the links are only reliable if referential integrity is enforced on all three relationships, otherwise a booking could refer to a course that doesn't exist. Also, the composite key means a learner could not book the same course again in a later term; if Elmwood wanted that, I would add a term or start date to the key.</p>" },

    { t: "scenario", title: "Question 2 – Oakridge Climbing Centre (validation)", html:
      "<p>On Day 5 you set up this validation for Oakridge: Climber ID input mask <code>\\C\\L000</code>; Climber Age rule <code>&gt;=8</code>; Session Level Value List (Beginner; Improver; Advanced) with Limit To List = Yes; Instructor Phone input mask <code>00000 000000</code>; Climber Name Required = Yes; Instructor ID in tblSession looked up from tblInstructor with referential integrity.</p>" +
      "<p><b>Evaluate how effectively the validation you used will help Oakridge keep accurate data.</b> <i>(6 marks)</i></p>" },
    { t: "essay", minWords: 150, q: "Write your evaluation of Oakridge's validation.", check: [
      "I explained at least two specific checks by name AND what error each one stops (e.g. 'C001' rejected by the mask; age 6 rejected by the rule)",
      "I linked checks to the centre's needs (e.g. under-8s can't be booked – a safety requirement)",
      "I explained the Value List keeping levels consistent (no misspellings), so searches/reports are reliable",
      "I explained the Instructor ID lookup + referential integrity stopping sessions with an instructor who doesn't exist",
      "I explained that validation checks format/range, not truth (e.g. a wrong but valid age or phone number is still accepted)",
      "I suggested a sensible improvement (e.g. validation text on every check, an upper age limit, Indexed No Duplicates where needed)"],
      model: "<p>The input mask <code>\\C\\L000</code> on Climber ID forces every ID to be 'CL' plus three digits, so a typing mistake such as 'C001' or 'CL12' cannot be saved and IDs stay consistent. The rule <code>&gt;=8</code> on Climber Age meets the centre's safety requirement that no climber under 8 is registered – an age of 6 is rejected with a validation message. The Value List on Session Level with Limit To List set to Yes means only Beginner, Improver or Advanced can be entered, so a misspelling like 'Begginer' can't split the results of a query or report on level. Looking up Instructor ID from tblInstructor, with referential integrity enforced on the relationship, means a session can't be assigned to an instructor who doesn't exist.</p><p>However, validation only checks that data is reasonable, not that it is correct. The phone mask accepts any 11 digits, so a mistyped but well-formed number is still saved, and an age of 9 entered instead of 19 passes the rule. The age rule also has no upper limit, so 150 would be accepted; <code>Between 8 And 99</code> would be better. Overall the validation greatly reduces errors at the point of entry, but staff still need to check details with climbers.</p>" },

    { t: "tip", title: "Tomorrow: the full mock", html: "<p>Day 10 is a complete Part A practice – all five activities on a brand-new scenario. Give yourself about 2 hours and try it without the reference sheet.</p>" }
  ]

      model: "<p>Replacing the spreadsheet with tblTeacher, tblClass, tblStudent and tblEnrolment means each teacher, class and student is stored once. In Figure 1 Ana Ruiz's details appear on five rows and Spanish Beginners' fee on four; now each is a single record, so changing a fee only needs one edit, which prevents update anomalies, and a new class can be added before anyone enrols.</p><p>Students take several classes and classes have several students, so tblEnrolment links them. Its composite primary key of Student ID + Class ID stops a student being enrolled on the same class twice, which an AutoNumber key would not. Enrol Date and Fee Paid belong to each enrolment (Jamal has paid for German but not Spanish), so storing them in tblEnrolment lets the school's 'who still owes fees' query filter Fee Paid = No accurately.</p><p>Validation supports accurate data: the input mask <code>\\S000</code> forces IDs like S101 and rejects S10; <code>Between 100 And 250</code> on Class Fee stops a fee of £1,200 being typed by mistake, which would break the discount and amount-due calculations; and <code>Like \"*@*\"</code> rejects an email missing the @. The Value List on Class Day keeps days consistent for searches.</p><p>However, validation checks format and range, not truth – a valid-looking but wrong email is still accepted, so the school should confirm details with students. Also, because of the composite key a student could not re-enrol on the same class in a later term; adding a term field to the key would solve this.</p>" },

<script>
/* Unit 2 Part A – Home Revision engine (vanilla JS, no libraries) */
(function () {
  "use strict";
  var C = window.COURSE;
  var KEY = "u2_partA_home_v1";

  /* ---------- storage (never throws) ---------- */
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.answers) return s; } catch (e) {}
    return { name: "", group: "", answers: {}, essays: {}, visited: {}, sent: [] };
  }
  var S = load();
  if (!S.essays) S.essays = {};
  if (!S.visited) S.visited = {};
  if (!S.sent) S.sent = [];
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* ---------- helpers ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }

  var N = {
    quotes: function (s) { return String(s).replace(/[“”„″]/g, '"').replace(/[‘’′']/g, '"').replace(/–|—/g, "-"); },
    expr: function (s) { s = N.quotes(s).toLowerCase().replace(/[\[\]]/g, "").replace(/\s+/g, ""); s = s.replace(/^=/, "").replace(/;+$/, ""); return s; },
    calc: function (s) { s = N.expr(s); var i = s.indexOf(":"); return i >= 0 ? s.slice(i + 1) : s; },
    mask: function (s) { s = N.quotes(s).replace(/\s+/g, ""); var i = s.indexOf(";"); return i >= 0 ? s.slice(0, i) : s; },
    word: function (s) { return N.quotes(s).toLowerCase().replace(/[^a-z0-9£.\-+ ]/g, " ").replace(/\s+/g, " ").trim(); },
    num: function (s) { var v = parseFloat(String(s).replace(/[£,\s%]/g, "")); return isNaN(v) ? "NaN" : String(Math.round(v * 100) / 100); }
  };
  function matches(val, accept, mode) {
    var f = N[mode || "word"] || N.word, v = f(val);
    if (!v || v === "NaN") return false;
    for (var i = 0; i < accept.length; i++) {
      var a = accept[i];
      if (a instanceof RegExp) { if (a.test(v)) return true; }
      else if (f(a) === v) return true;
    }
    return false;
  }
  function firstAccept(accept) { for (var i = 0; i < accept.length; i++) if (!(accept[i] instanceof RegExp)) return accept[i]; return ""; }

  /* ---------- course indexing ---------- */
  C.days.forEach(function (d) {
    var qi = 0;
    d.blocks.forEach(function (b) {
      if (isQ(b)) { qi++; b._n = qi; if (!b.id) b.id = d.id + "-q" + qi; b._max = maxOf(b); }
    });
    d._qcount = qi;
  });
  function isQ(b) { return ["mcq", "multi", "text", "match", "grid", "essay"].indexOf(b.t) >= 0; }
  function maxOf(b) {
    if (b.t === "match") return b.items.length;
    if (b.t === "grid") { var m = 0; b.rows.forEach(function (r) { r.forEach(function (c) { if (c && typeof c === "object") m++; }); }); return m; }
    if (b.t === "essay") return b.check.length;
    return 1;
  }
  function dayStats(d) {
    var auto = { done: 0, total: 0, score: 0, max: 0 }, self = { done: 0, total: 0, score: 0, max: 0 };
    d.blocks.forEach(function (b) {
      if (!isQ(b)) return;
      if (b.t === "essay") {
        self.total++; self.max += b._max;
        var e = S.essays[b.id];
        if (e && e.marked) { self.done++; self.score += (e.ticks || []).filter(Boolean).length; }
      } else {
        auto.total++; auto.max += b._max;
        var a = S.answers[b.id];
        if (a) { auto.done++; auto.score += a.best || 0; }
      }
    });
    var items = auto.total + self.total, done = auto.done + self.done;
    return { auto: auto, self: self, pct: items ? Math.round(100 * done / items) : 0, scorePct: auto.max ? Math.round(100 * auto.score / auto.max) : 0 };
  }

  /* ---------- question renderers ---------- */
  function qShell(b, inner, tag) {
    return '<div class="q" id="' + b.id + '" data-q="' + b.id + '">' +
      '<div class="qnum">Question ' + b._n + (tag ? ' <span class="tag">' + tag + "</span>" : "") + (b._max > 1 ? ' <span class="tag">' + b._max + ' points</span>' : "") + "</div>" +
      '<div class="qtext">' + b.q + "</div>" + inner +
      '<div class="actions"></div><div class="fbx"></div></div>';
  }
  function optLetter(i) { return "ABCDEFGH"[i]; }

  var R = {
    mcq: function (b) {
      var h = '<div class="opts">' + b.opts.map(function (o, i) {
        return '<label class="opt"><input type="radio" name="' + b.id + '" value="' + i + '"><span><b>' + optLetter(i) + ".</b> " + o + "</span></label>";
      }).join("") + "</div>";
      return qShell(b, h, "Choose one");
    },
    multi: function (b) {
      var h = '<div class="opts">' + b.opts.map(function (o, i) {
        return '<label class="opt"><input type="checkbox" value="' + i + '"><span>' + o + "</span></label>";
      }).join("") + "</div>";
      return qShell(b, h, "Choose all that apply");
    },
    text: function (b) {
      var cls = (b.mode === "expr" || b.mode === "mask" || b.mode === "calc") ? "mono" : "";
      var h = (b.pre ? '<div class="hint">' + b.pre + "</div>" : "") +
        '<input type="text" class="' + cls + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(b.ph || "Type your answer") + '">' +
        (b.hint ? '<div class="hint">💡 ' + b.hint + "</div>" : "");
      return qShell(b, h, b.mode === "expr" ? "Type the Access setting" : b.mode === "mask" ? "Type the input mask" : b.mode === "calc" ? "Type the calculated field" : b.mode === "num" ? "Type a number" : "Type your answer");
    },
    match: function (b) {
      var opts = '<option value="">— choose —</option>' + b.choices.map(function (c) { return '<option>' + esc(c) + "</option>"; }).join("");
      var h = '<div class="tbl-wrap"><table class="data grid-q"><tr><th>' + (b.lh || "Item") + "</th><th>" + (b.rh || "Your answer") + "</th></tr>" +
        b.items.map(function (it, i) { return "<tr><td>" + it[0] + '</td><td><select data-i="' + i + '">' + opts + "</select></td></tr>"; }).join("") +
        "</table></div>";
      return qShell(b, h, "Match each one");
    },
    grid: function (b) {
      var k = 0;
      var h = (b.caption ? '<div class="qbe-title">' + b.caption + "</div>" : "") + '<div class="tbl-wrap"><table class="' + (b.qbe ? "qbe" : "data") + ' grid-q">';
      if (b.head) h += "<tr>" + b.head.map(function (x) { return "<th>" + x + "</th>"; }).join("") + "</tr>";
      b.rows.forEach(function (r) {
        h += "<tr>";
        r.forEach(function (c, ci) {
          var tag = (b.qbe && ci === 0) ? "th" : "td";
          if (c && typeof c === "object") {
            if (c.sel) h += "<" + tag + '><select data-k="' + k + '"><option value="">—</option>' + c.sel.map(function (o) { return "<option>" + esc(o) + "</option>"; }).join("") + "</select></" + tag + ">";
            else h += "<" + tag + '><input type="text" data-k="' + k + '" class="' + (c.mode === "word" || c.mode === "num" ? "" : "mono") + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(c.ph || "") + '"></' + tag + ">";
            k++;
          } else h += "<" + tag + ">" + (c == null ? "" : c) + "</" + tag + ">";
        });
        h += "</tr>";
      });
      h += "</table></div>";
      return qShell(b, h, b.tag || "Fill in the blanks");
    },
    essay: function (b) {
      var h = '<textarea placeholder="Write your answer here…"></textarea><div class="hint wc">0 words</div>' +
        '<div class="selfmark" style="display:none"><div class="fb info"><b class="h">Now mark yourself honestly.</b>Tick each point your answer actually makes (not just mentions in passing).</div>' +
        b.check.map(function (c, i) { return '<label class="check"><input type="checkbox" data-c="' + i + '"><span>' + c + "</span></label>"; }).join("") +
        '<div class="model"><b>Model answer</b><br>' + b.model + "</div></div>";
      return qShell(b, h, "Written answer – self-marked");
    }
  };

  /* ---------- checking ---------- */
  function readValue(b, node) {
    if (b.t === "mcq") { var r = $("input:checked", node); return r ? +r.value : null; }
    if (b.t === "multi") return $$("input:checked", node).map(function (x) { return +x.value; });
    if (b.t === "text") return $("input", node).value;
    if (b.t === "match") return $$("select", node).map(function (s) { return s.value; });
    if (b.t === "grid") return $$("[data-k]", node).map(function (s) { return s.value; });
    if (b.t === "essay") return $("textarea", node).value;
  }
  function writeValue(b, node, v) {
    if (v == null) return;
    if (b.t === "mcq") { var r = $('input[value="' + v + '"]', node); if (r) { r.checked = true; mark(node); } }
    else if (b.t === "multi") { v.forEach(function (i) { var c = $('input[value="' + i + '"]', node); if (c) c.checked = true; }); mark(node); }
    else if (b.t === "text") $("input", node).value = v;
    else if (b.t === "match" || b.t === "grid") { var f = b.t === "match" ? $$("select", node) : $$("[data-k]", node); f.forEach(function (s, i) { if (v[i] != null) s.value = v[i]; }); }
    else if (b.t === "essay") $("textarea", node).value = v;
  }
  function mark(node) { $$(".opt", node).forEach(function (o) { o.classList.toggle("sel", $("input", o).checked); }); }

  function gradableCells(b) {
    var out = [];
    b.rows.forEach(function (r) { r.forEach(function (c) { if (c && typeof c === "object") out.push(c); }); });
    return out;
  }
  function cellOk(c, v) {
    if (c.sel) return v === c.a || (Array.isArray(c.a) && c.a.indexOf(v) >= 0);
    return matches(v, c.accept, c.mode || "expr");
  }
  function cellAnswer(c) { return c.sel ? (Array.isArray(c.a) ? c.a[0] : c.a) : (c.show || firstAccept(c.accept)); }

  function grade(b, v) {
    if (b.t === "mcq") return { score: v === b.a ? 1 : 0, empty: v == null };
    if (b.t === "multi") {
      var want = b.a.slice().sort().join(","), got = (v || []).slice().sort().join(",");
      return { score: want === got ? 1 : 0, empty: !v || !v.length };
    }
    if (b.t === "text") return { score: matches(v, b.accept, b.mode) ? 1 : 0, empty: !String(v || "").trim() };
    if (b.t === "match") {
      var s = 0, per = b.items.map(function (it, i) { var ok = v[i] === it[1]; if (ok) s++; return ok; });
      return { score: s, per: per, empty: v.every(function (x) { return !x; }) };
    }
    if (b.t === "grid") {
      var cells = gradableCells(b), s2 = 0;
      var per2 = cells.map(function (c, i) { var ok = cellOk(c, v[i] || ""); if (ok) s2++; return ok; });
      return { score: s2, per: per2, empty: v.every(function (x) { return !String(x || "").trim(); }) };
    }
  }

  function nearMsg(b, v) {
    if (!b.near) return "";
    for (var i = 0; i < b.near.length; i++) {
      var n = b.near[i], f = N[b.mode || "word"] || N.word, vv = f(v);
      if ((n.re && n.re.test(vv)) || (n.is && f(n.is) === vv)) return n.msg;
    }
    if (b.mode === "mask" && matches(String(v).toUpperCase(), b.accept.map(function (a) { return a instanceof RegExp ? a : String(a).toUpperCase(); }), "mask")) {
      return "Very close — check UPPER/lower case. In an input mask <code>L</code> means 'letter required'; a lower-case <code>l</code> is not a mask character.";
    }
    return "";
  }

  function feedback(b, node, res, showAns) {
    var fbx = $(".fbx", node), full = res.score === b._max;
    node.classList.toggle("correct", full);
    node.classList.toggle("wrong", !full);
    var head;
    if (full) head = '<b class="h">✅ Correct' + (b._max > 1 ? " — " + res.score + "/" + b._max : "") + "</b>";
    else if (b._max > 1) head = '<b class="h">' + (res.score ? "🟡 " : "❌ ") + res.score + "/" + b._max + " correct. Red boxes need another look.</b>";
    else head = '<b class="h">❌ Not quite.</b>';
    var extra = "";
    if (!full && b.t === "text") extra = nearMsg(b, readValue(b, node));
    var answer = "";
    if (showAns || full) {
      if (b.t === "text" && !full) answer = '<div>Answer: <code>' + esc(b.show || firstAccept(b.accept)) + "</code></div>";
      if ((b.t === "grid" || b.t === "match") && !full) answer = "<div>Correct answers are now shown in green under each box.</div>";
    }
    var why = (full || showAns) && b.why ? '<div style="margin-top:6px">' + b.why + "</div>" : (!full ? '<div style="margin-top:4px">Have another go, or press <b>Show answer</b> to see the explanation.</div>' : "");
    fbx.innerHTML = '<div class="fb ' + (full ? "ok" : "bad") + '">' + head + (extra ? "<div>" + extra + "</div>" : "") + answer + why + "</div>";

    // per-option / per-cell colouring
    if (b.t === "mcq" || b.t === "multi") {
      var right = b.t === "mcq" ? [b.a] : b.a;
      $$(".opt", node).forEach(function (o, i) {
        var chosen = $("input", o).checked;
        o.classList.remove("ok", "bad");
        if (chosen && right.indexOf(i) >= 0) o.classList.add("ok");
        else if (chosen) o.classList.add("bad");
        else if ((showAns || full) && right.indexOf(i) >= 0) o.classList.add("ok");
      });
    }
    if (b.t === "text") { var inp = $("input", node); inp.classList.toggle("ok", full); inp.classList.toggle("bad", !full); }
    if (b.t === "match" || b.t === "grid") {
      var fields = b.t === "match" ? $$("select", node) : $$("[data-k]", node);
      var cells = b.t === "grid" ? gradableCells(b) : null;
      $$(".ans", node).forEach(function (a) { a.remove(); });
      fields.forEach(function (f, i) {
        f.classList.toggle("ok", !!res.per[i]); f.classList.toggle("bad", !res.per[i]);
        if (showAns && !res.per[i]) {
          var txt = b.t === "match" ? b.items[i][1] : cellAnswer(cells[i]);
          f.insertAdjacentHTML("afterend", '<span class="ans">✔ ' + esc(txt) + "</span>");
        }
      });
    }
  }

  function setupQ(b, node) {
    var acts = $(".actions", node);
    if (b.t === "essay") return setupEssay(b, node, acts);
    acts.innerHTML = '<button class="btn small chk">Check answer</button><button class="btn ghost small show" style="display:none">Show answer</button>';
    $$(".opt input", node).forEach(function (i) { i.addEventListener("change", function () { mark(node); }); });
    var prev = S.answers[b.id];
    if (prev) { writeValue(b, node, prev.v); var r0 = grade(b, prev.v); feedback(b, node, r0, prev.shown); if (r0.score < b._max) $(".show", node).style.display = ""; }
    $(".chk", node).addEventListener("click", function () {
      var v = readValue(b, node), res = grade(b, v);
      if (res.empty) { $(".fbx", node).innerHTML = '<div class="fb info">Answer first, then check. 🙂</div>'; return; }
      var a = S.answers[b.id] || { tries: 0, first: null, best: 0, shown: false };
      a.tries++; if (a.first == null) a.first = res.score;
      if (!a.shown) a.best = Math.max(a.best || 0, res.score);
      a.v = v; S.answers[b.id] = a; save();
      feedback(b, node, res, a.shown);
      $(".show", node).style.display = res.score < b._max ? "" : "none";
      refreshProgress();
    });
    $(".show", node).addEventListener("click", function () {
      var v = readValue(b, node), res = grade(b, v);
      var a = S.answers[b.id] || { tries: 0, first: 0, best: 0 };
      if (a.first == null) a.first = 0;
      a.shown = true; a.v = v; S.answers[b.id] = a; save();
      feedback(b, node, res, true);
      refreshProgress();
    });
  }

  function setupEssay(b, node, acts) {
    var ta = $("textarea", node), wc = $(".wc", node), sm = $(".selfmark", node);
    var e = S.essays[b.id] || { text: "", ticks: [], marked: false };
    ta.value = e.text || "";
    function count() { var n = (ta.value.trim().match(/\S+/g) || []).length; wc.textContent = n + " words" + (b.minWords ? " (aim for " + b.minWords + "+)" : ""); return n; }
    count();
    ta.addEventListener("input", function () { count(); e.text = ta.value; S.essays[b.id] = e; save(); });
    acts.innerHTML = '<button class="btn small done">I\'ve finished — show me the mark scheme</button>';
    function open() {
      sm.style.display = "";
      $$("input[data-c]", node).forEach(function (c, i) { c.checked = !!(e.ticks && e.ticks[i]); });
      acts.innerHTML = '<button class="btn small green savemark">Save my self-mark</button>';
      $(".savemark", node).addEventListener("click", function () {
        e.ticks = $$("input[data-c]", node).map(function (c) { return c.checked; });
        e.marked = true; S.essays[b.id] = e; save();
        var s = e.ticks.filter(Boolean).length;
        $(".fbx", node).innerHTML = '<div class="fb ok"><b class="h">Saved: ' + s + "/" + b._max + ".</b>" + (s < b._max ? "Rewrite your answer above to add the points you missed, then re-tick. Rewriting is where the learning happens." : "Excellent — that would sit in the top band.") + "</div>";
        refreshProgress();
      });
    }
    if (e.revealed) open();
    $(".done", node) && $(".done", node).addEventListener("click", function () {
      if (count() < 25) { $(".fbx", node).innerHTML = '<div class="fb info">Write a proper attempt first (at least a few sentences) — you learn far more by comparing your own answer than by reading the model.</div>'; return; }
      e.revealed = true; e.text = ta.value; S.essays[b.id] = e; save(); open();
    });
  }

  /* ---------- pages ---------- */
  var main, side;
  function navHtml(cur) {
    var h = '<nav class="nav"><a href="#home" class="' + (cur === "home" ? "active" : "") + '">🏠 Start here</a>';
    var wk = 0;
    C.days.forEach(function (d) {
      if (d.week !== wk) { wk = d.week; h += '<div class="wk">Week ' + wk + "</div>"; }
      var st = dayStats(d), cls = st.pct >= 100 ? "full" : st.pct > 0 ? "part" : "";
      h += '<a href="#day-' + d.n + '" class="' + (cur === "day-" + d.n ? "active" : "") + '"><span class="dot ' + cls + '"></span>Day ' + d.n + ": " + d.short + '<span class="pct">' + st.pct + "%</span></a>";
    });
    h += '<div class="wk">Always available</div><a href="#ref" class="' + (cur === "ref" ? "active" : "") + '">📘 Reference sheet</a><a href="#report" class="' + (cur === "report" ? "active" : "") + '">📤 My progress / send to teacher</a></nav>';
    return h;
  }
  function refreshProgress() {
    var cur = (location.hash || "#home").slice(1);
    side.innerHTML = navHtml(cur);
    var hd = $("#dayprog");
    if (hd) { var d = C.days[+hd.dataset.n - 1], st = dayStats(d); hd.innerHTML = progLine(st); }
  }
  function progLine(st) {
    return '<div class="bar"><i style="width:' + st.pct + '%"></i></div><div class="notice" style="margin-top:4px">' + st.pct + "% of questions attempted · auto-marked score " + st.auto.score + "/" + st.auto.max + (st.self.total ? " · written answers self-marked " + st.self.score + "/" + st.self.max : "") + "</div>";
  }

  function renderHome() {
    var h = '<div class="dayhead"><div class="kicker">Unit 2: Creating Systems to Manage Information</div><h1>Part A Home Revision Programme</h1>' +
      '<p>Two weeks of guided practice for <b>Activities 1–5</b> of the Part A Set Task. You don\'t need Microsoft Access for any of this — Part A is about working out the right design and writing it down, and that\'s exactly what you\'ll practise here. Every question marks itself and explains the answer.</p></div>';
    h += '<div class="card"><h3>1. Tell us who you are</h3><div class="two"><div class="field"><label for="nm">Your full name</label><input id="nm" value="' + esc(S.name) + '" placeholder="e.g. Sam Patel"></div>' +
      '<div class="field"><label for="gp">Your class / group</label><input id="gp" value="' + esc(S.group) + '" placeholder="e.g. L3 IT Year 1 – Southall"></div></div>' +
      '<p class="notice">Your work saves automatically <b>on this device, in this browser</b>. If you switch to a different phone or computer, it starts fresh — so try to use the same device each day. Don\'t use private/incognito browsing.</p></div>';
    h += '<div class="card"><h3>2. How the two weeks work</h3><ul>' +
      "<li><b>One day = one session of about 60–90 minutes.</b> Do them in order — each day builds on the one before.</li>" +
      "<li>Every day starts with <b>Learn</b> cards (read these properly), then <b>Practise</b> questions. Press <b>Check answer</b> after each one.</li>" +
      "<li>Got it wrong? Try again first. Only press <b>Show answer</b> when you're stuck — then read the explanation and make sure you understand <i>why</i>.</li>" +
      "<li>Written (6-mark) questions are marked by you against a checklist and a model answer. Be honest — nobody gains from a fake tick.</li>" +
      "<li>At the end of <b>Day 5</b> and <b>Day 10</b>, open <b>My progress</b> and press <b>Send to my teacher</b>.</li>" +
      "<li>Keep the <b>Reference sheet</b> open in another tab — but by Day 10 try to answer without it, like the real exam.</li></ul></div>";
    h += '<h2 style="margin-top:22px">Your plan</h2><div class="daygrid">' + C.days.map(function (d) {
      var st = dayStats(d);
      return '<a class="daycard" href="#day-' + d.n + '"><div class="kicker">Week ' + d.week + " · Day " + d.n + '</div><div class="t">' + d.title + '</div><div class="s">' + d.activity + " · " + d.time + '</div><div class="bar"><i style="width:' + st.pct + '%"></i></div><div class="notice" style="margin-top:3px">' + st.pct + "% done</div></a>";
    }).join("") + "</div>";
    main.innerHTML = h;
    $("#nm").addEventListener("input", function (e) { S.name = e.target.value; save(); who(); });
    $("#gp").addEventListener("input", function (e) { S.group = e.target.value; save(); });
  }

  function renderDay(n) {
    var d = C.days[n - 1];
    if (!d) return renderHome();
    S.visited[d.id] = S.visited[d.id] || new Date().toISOString(); save();
    var st = dayStats(d);
    var h = '<div class="dayhead"><div class="kicker">Week ' + d.week + " · Day " + d.n + "</div><h1>" + d.title + '</h1><div class="meta"><span class="pill">' + d.activity + '</span><span class="pill p2">⏱ ' + d.time + '</span><span class="pill p3">' + d._qcount + " questions</span></div>" +
      (d.intro ? "<p>" + d.intro + "</p>" : "") + '<div id="dayprog" data-n="' + d.n + '">' + progLine(st) + "</div></div>";
    d.blocks.forEach(function (b) {
      if (b.t === "learn" || b.t === "scenario" || b.t === "tip") h += '<div class="card ' + b.t + '"><div class="kicker">' + (b.t === "learn" ? "Learn" : b.t === "scenario" ? "Scenario" : "Exam tip") + "</div>" + (b.title ? "<h3>" + b.title + "</h3>" : "") + b.html + "</div>";
      else if (b.t === "h") h += '<h2 style="margin:26px 0 10px">' + b.text + "</h2>" + (b.sub ? '<p class="notice" style="margin-top:-4px">' + b.sub + "</p>" : "");
      else if (R[b.t]) h += R[b.t](b);
    });
    h += '<div class="pager">' + (n > 1 ? '<a class="btn ghost" href="#day-' + (n - 1) + '">← Day ' + (n - 1) + "</a>" : "<span></span>") +
      (n < C.days.length ? '<a class="btn" href="#day-' + (n + 1) + '">Day ' + (n + 1) + " →</a>" : '<a class="btn green" href="#report">Send my progress →</a>') + "</div>";
    main.innerHTML = h;
    d.blocks.forEach(function (b) { if (isQ(b)) setupQ(b, document.getElementById(b.id)); });
  }

  function renderRef() {
    main.innerHTML = '<div class="dayhead"><div class="kicker">Keep this open in another tab</div><h1>Reference sheet</h1><p>Everything you need for Activities 1–4 on one page. Use it while you learn — then try to stop needing it.</p></div>' + C.reference;
    $$('a[href^="#ref-"]', main).forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); var t = document.getElementById(a.getAttribute("href").slice(1)); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); });
    });
  }

  function reportText() {
    var lines = [];
    lines.push("Unit 2 Part A Home Revision – progress report");
    lines.push("Name: " + (S.name || "(not given)") + "   Group: " + (S.group || "(not given)"));
    lines.push("Generated: " + new Date().toLocaleString("en-GB"));
    lines.push("");
    var ta = 0, tm = 0;
    C.days.forEach(function (d) {
      var st = dayStats(d); ta += st.auto.score; tm += st.auto.max;
      lines.push("Day " + d.n + " (" + d.short + "): " + st.pct + "% attempted | auto " + st.auto.score + "/" + st.auto.max + (st.self.total ? " | written self-mark " + st.self.score + "/" + st.self.max : ""));
    });
    lines.push("");
    lines.push("TOTAL auto-marked: " + ta + "/" + tm + " (" + (tm ? Math.round(100 * ta / tm) : 0) + "%)");
    return { text: lines.join("\n"), total: ta + "/" + tm + " (" + (tm ? Math.round(100 * ta / tm) : 0) + "%)" };
  }

  function renderReport() {
    var rows = C.days.map(function (d) {
      var st = dayStats(d);
      return "<tr><td>Day " + d.n + "</td><td>" + d.short + '</td><td style="min-width:110px"><div class="bar"><i style="width:' + st.pct + '%"></i></div>' + st.pct + "%</td><td>" + st.auto.score + "/" + st.auto.max + "</td><td>" + (st.self.total ? st.self.score + "/" + st.self.max : "–") + "</td></tr>";
    }).join("");
    var r = reportText();
    var h = '<div class="dayhead"><div class="kicker">Your record</div><h1>My progress</h1></div>' +
      '<div class="card"><div class="two"><div class="field"><label for="nm2">Your full name</label><input id="nm2" value="' + esc(S.name) + '"></div><div class="field"><label for="gp2">Your class / group</label><input id="gp2" value="' + esc(S.group) + '"></div></div>' +
      '<div class="score-big">' + esc(r.total) + '</div><div class="notice">Total auto-marked score so far</div></div>' +
      '<div class="card"><div class="tbl-wrap"><table class="data"><tr><th>Day</th><th>Topic</th><th>Attempted</th><th>Auto-marked</th><th>Written (self)</th></tr>' + rows + "</table></div></div>" +
      '<div class="card"><h3>Send to my teacher</h3><p>Do this at the end of <b>Day 5</b> and again at the end of <b>Day 10</b>. Make sure your name is filled in first.</p>' +
      '<div class="field"><label for="cp">Which checkpoint is this?</label><select id="cp"><option>End of Week 1 (Day 5)</option><option>End of Week 2 (Day 10)</option><option>Other / extra update</option></select></div>' +
      '<div class="actions"><button class="btn green" id="send">📤 Send to my teacher</button><button class="btn ghost" id="copy">📋 Copy my report</button><button class="btn ghost" id="dl">⬇️ Download my report</button></div><div id="sendfb"></div>' +
      '<p class="notice" style="margin-top:10px">If sending doesn\'t work, press <b>Copy my report</b> and paste it into Google Classroom (or wherever your teacher asks).</p>' +
      (S.sent.length ? '<p class="notice">Sent before: ' + S.sent.map(function (s) { return esc(s); }).join(", ") + "</p>" : "") + "</div>" +
      '<div class="card"><h3>Start again</h3><p class="notice">Wipes every answer on this device. Only do this if your teacher tells you to.</p><button class="btn ghost small" id="reset">Reset all my progress</button></div>';
    main.innerHTML = h;
    $("#nm2").addEventListener("input", function (e) { S.name = e.target.value; save(); who(); });
    $("#gp2").addEventListener("input", function (e) { S.group = e.target.value; save(); });
    $("#copy").addEventListener("click", function () {
      var t = reportText().text;
      var done = function () { $("#sendfb").innerHTML = '<div class="fb ok">Copied. Now paste it where your teacher asked.</div>'; };
      try { navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); }); } catch (e) { fallbackCopy(t); done(); }
    });
    $("#dl").addEventListener("click", function () {
      var blob = new Blob([reportText().text], { type: "text/plain" }), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "Unit2_PartA_progress_" + (S.name || "student").replace(/[^a-z0-9]+/gi, "_") + ".txt";
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });
    $("#send").addEventListener("click", function () {
      var fb = $("#sendfb");
      if (!S.name.trim()) { fb.innerHTML = '<div class="fb bad">Please type your full name above first.</div>'; return; }
      var rt = reportText(), cp = $("#cp").value;
      var body = new URLSearchParams({ "form-name": "unit2-progress", student_name: S.name, class_group: S.group, checkpoint: cp, overall: rt.total, summary: rt.text }).toString();
      this.disabled = true; var btn = this;
      fb.innerHTML = '<div class="fb info">Sending…</div>';
      fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body })
        .then(function (res) {
          if (!res.ok) throw new Error(res.status);
          S.sent.push(cp + " – " + new Date().toLocaleDateString("en-GB")); save();
          fb.innerHTML = '<div class="fb ok"><b class="h">✅ Sent. Well done.</b>Your teacher can now see your progress.</div>';
        })
        .catch(function () {
          fb.innerHTML = '<div class="fb bad"><b class="h">Couldn\'t send from here.</b>Press <b>Copy my report</b> and paste it into Google Classroom instead.</div>';
        })
        .then(function () { btn.disabled = false; });
    });
    $("#reset").addEventListener("click", function () {
      if (this.dataset.armed) { S = { name: "", group: "", answers: {}, essays: {}, visited: {}, sent: [] }; save(); who(); route(); return; }
      this.dataset.armed = "1"; this.textContent = "Press again to confirm – this cannot be undone";
    });
  }
  function fallbackCopy(t) { var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove(); }
  function who() { var w = $("#who"); if (w) w.textContent = S.name ? "👤 " + S.name : ""; }

  function route() {
    var h = (location.hash || "#home").slice(1);
    side.innerHTML = navHtml(h);
    if (/^day-\d+$/.test(h)) renderDay(+h.split("-")[1]);
    else if (h === "ref") renderRef();
    else if (h === "report") renderReport();
    else renderHome();
    window.scrollTo(0, 0);
    side.classList.remove("open"); $(".scrim").classList.remove("show");
  }

  document.addEventListener("DOMContentLoaded", function () {
    main = $("#main"); side = $("#side");
    who();
    $(".menu-btn").addEventListener("click", function () { side.classList.toggle("open"); $(".scrim").classList.toggle("show"); });
    $(".scrim").addEventListener("click", function () { side.classList.remove("open"); this.classList.remove("show"); });
    window.addEventListener("hashchange", route);
    route();
  });
})();

</script>
</body>
</html>
