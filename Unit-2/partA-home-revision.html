<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2 Part A – Home Revision</title>
<meta name="description" content="Two-week interactive home revision programme for BTEC Unit 2 Part A (Activities 1–5). Self-marking, no Microsoft Access needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2230; --ink-2:#4b5565; --muted:#6b7280; --line:#e3e6ec; --bg:#f3f5f8; --card:#ffffff;
  --blue:#2e5e8c; --blue-2:#3b82f6; --blue-soft:#eaf1fb; --purple:#6b3fa0; --purple-soft:#f2ecfa;
  --green:#15803d; --green-soft:#e8f6ec; --red:#b42318; --red-soft:#fdecea; --amber:#a15c07; --amber-soft:#fff6e0;
  --code-bg:#eef1f6; --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
a{color:var(--blue-2)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px;white-space:nowrap}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.7rem;letter-spacing:-.02em}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
p{margin:.4em 0 .8em}
ul,ol{margin:.3em 0 .8em;padding-left:1.3em}
li{margin:.2em 0}

/* layout */
.topbar{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.topbar .brand{font-weight:700;font-size:1rem;color:#fff;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.topbar .who{font-size:.85rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.menu-btn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:1rem;cursor:pointer}
.wrap{display:flex;max-width:1180px;margin:0 auto}
.side{width:270px;flex:0 0 270px;padding:16px 12px 40px;position:sticky;top:52px;align-self:flex-start;max-height:calc(100vh - 52px);overflow:auto}
.main{flex:1;min-width:0;padding:20px 20px 80px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.92rem}
.nav a:hover{background:#e8edf4}
.nav a.active{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav .wk{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px;font-weight:700}
.nav .pct{margin-left:auto;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .dot{width:9px;height:9px;border-radius:50%;background:#cfd6e0;flex:0 0 9px}
.nav .dot.part{background:#f0b44c}.nav .dot.full{background:var(--green)}
@media (max-width:880px){
  .side{position:fixed;left:0;top:52px;bottom:0;background:var(--card);z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 16px rgba(0,0,0,.15);max-height:none}
  .side.open{transform:none}
  .main{padding:16px 16px 80px}
}
@media (min-width:881px){.menu-btn{display:none}}

/* cards */
.card{scroll-margin-top:64px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.card.learn{border-left:5px solid var(--blue)}
.card.scenario{border-left:5px solid var(--purple);background:#fcfbfe}
.card.tip{border-left:5px solid var(--amber);background:var(--amber-soft)}
.kicker{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--blue);margin-bottom:4px}
.card.scenario .kicker{color:var(--purple)}
.card.tip .kicker{color:var(--amber)}
.dayhead{margin-bottom:18px}
.dayhead .meta{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.pill{display:inline-block;font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.pill.p2{background:var(--purple-soft);color:var(--purple)}
.pill.p3{background:var(--green-soft);color:var(--green)}
.bar{height:8px;background:#e3e8ef;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}

/* tables */
.tbl-wrap{overflow-x:auto;margin:8px 0 12px;-webkit-overflow-scrolling:touch}
table.data{border-collapse:collapse;font-size:.88rem;min-width:100%}
table.data th{background:#404a5c;color:#fff;text-align:left;padding:6px 9px;font-weight:600;white-space:nowrap}
table.data td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}
table.data tr:nth-child(even) td{background:#f8f9fb}
table.data.purple th{background:var(--purple)}
table.data td.hl{background:#fff3c4 !important;font-weight:600}
table.data td.hl2{background:#dff3e4 !important;font-weight:600}
mark.ent{background:#fff1a8;padding:0 3px;border-radius:3px}
mark.rel{background:#cdeed6;padding:0 3px;border-radius:3px}
mark.att{background:#dbe6ff;padding:0 3px;border-radius:3px}

/* ERD boxes */
.erd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.ent{border:2px solid var(--blue);border-radius:8px;background:#fff;min-width:140px;font-size:.85rem}
.ent b{display:block;background:var(--blue);color:#fff;padding:4px 8px;font-size:.85rem}
.ent span{display:block;padding:2px 8px}
.ent span.pk{font-weight:700}.ent span.pk::after{content:"  PK";color:var(--blue);font-size:.72rem}
.ent span.fk::after{content:"  FK";color:var(--purple);font-size:.72rem;font-weight:700}
.ent span.pkfk{font-weight:700}.ent span.pkfk::after{content:"  PK + FK";color:var(--purple);font-size:.72rem}
.ent.link{border-color:var(--purple)}.ent.link b{background:var(--purple)}
.arrow{font-size:.8rem;color:var(--ink-2);text-align:center;font-weight:600;line-height:1.2}
.arrow .ln{font-size:1.3rem;color:var(--ink)}

/* QBE grid */
table.qbe{border-collapse:collapse;font-size:.85rem;background:#fff}
table.qbe th{background:#e9edf3;text-align:right;padding:5px 8px;font-weight:600;color:var(--ink-2);border:1px solid #cdd3dc;white-space:nowrap}
table.qbe td{border:1px solid #cdd3dc;padding:4px 7px;min-width:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
.qbe-title{font-size:.78rem;color:var(--muted);margin:2px 0 4px}

/* questions */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.q .qnum{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.q .qnum .tag{background:#eef1f6;color:var(--ink-2);padding:1px 8px;border-radius:99px;text-transform:none;letter-spacing:0;font-weight:600}
.q .qtext{font-weight:500;margin-bottom:10px}
.q.correct{border-color:#9bd3ad;background:linear-gradient(0deg,#fbfefc,#fff)}
.q.wrong{border-color:#efb3ac}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit}
.opt:hover{border-color:#b9c6d8}
.opt input{margin-top:4px;flex:0 0 auto}
.opt.sel{border-color:var(--blue-2);background:var(--blue-soft)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.q input[type=text],.q textarea,.q select,.field input,.field select{font:inherit;border:1.5px solid #cdd3dc;border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);max-width:100%}
.q input[type=text]{width:100%}
.q input.mono,.q textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
.q textarea{width:100%;min-height:150px;line-height:1.5}
.q select{width:100%}
.q input.ok,.q select.ok{border-color:var(--green);background:var(--green-soft)}
.q input.bad,.q select.bad{border-color:var(--red);background:var(--red-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;background:var(--blue-2);color:#fff}
.btn:hover{background:#2563eb}
.btn.ghost{background:#eef1f6;color:var(--ink)}
.btn.ghost:hover{background:#e2e7ef}
.btn.green{background:var(--green)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px;font-size:.94rem}
.fb.ok{background:var(--green-soft);border:1px solid #a7d8b6}
.fb.bad{background:var(--red-soft);border:1px solid #efb3ac}
.fb.info{background:var(--blue-soft);border:1px solid #c6d7ee}
.fb b.h{display:block;margin-bottom:3px}
.hint{font-size:.88rem;color:var(--ink-2);margin-top:6px}
.grid-q td{vertical-align:middle}
.grid-q td input,.grid-q td select{width:100%;min-width:110px}
.ans{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;color:var(--green);display:block;margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:5px}
.model{background:#f7f8fa;border-left:4px solid var(--blue);padding:10px 14px;border-radius:6px;margin-top:10px}
.score-big{font-size:2.2rem;font-weight:700;letter-spacing:-.02em}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.daycard{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.daycard:hover{border-color:#b9c6d8}
.daycard .t{font-weight:700;margin:2px 0 4px}
.daycard .s{font-size:.86rem;color:var(--ink-2);margin-bottom:8px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.field{margin:8px 0}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:3px}
.field input,.field select{width:100%;max-width:420px}
.notice{font-size:.85rem;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.toc{columns:2;font-size:.92rem}
@media (max-width:700px){.toc{columns:1}}
.badge-ok{color:var(--green);font-weight:700}
.badge-no{color:var(--red);font-weight:700}
.sr{position:absolute;left:-9999px}
.scrim{display:none}
@media (max-width:880px){.scrim.show{display:block;position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.25);z-index:25}}
@media print{.topbar,.side,.actions,.pager{display:none}.main{padding:0}}

</style>
</head>
<body>
<!-- Netlify Forms: this hidden form lets Netlify detect the "unit2-progress" form at deploy time. -->
<form name="unit2-progress" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="unit2-progress">
  <input name="bot-field">
  <input name="student_name">
  <input name="class_group">
  <input name="checkpoint">
  <input name="overall">
  <textarea name="summary"></textarea>
</form>

<div class="topbar">
  <button class="menu-btn" aria-label="Open menu">☰</button>
  <a class="brand" href="#home">Unit 2 · Part A Home Revision</a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
</div>
<div class="scrim"></div>
<div class="wrap">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><p>Loading…</p></main>
</div>
<noscript><p style="padding:20px">This page needs JavaScript switched on.</p></noscript>
<script>
window.COURSE = { days: [], reference: "" };
/* content helpers */
function T(head, rows, cls) {
  var h = '<div class="tbl-wrap"><table class="data ' + (cls || "") + '"><tr>' + head.map(function (x) { return "<th>" + x + "</th>"; }).join("") + "</tr>";
  rows.forEach(function (r) {
    h += "<tr>" + r.map(function (c) {
      if (c && typeof c === "object") return '<td class="' + (c.c || "hl") + '">' + c.v + "</td>";
      return "<td>" + c + "</td>";
    }).join("") + "</tr>";
  });
  return h + "</table></div>";
}
function ENT(name, fields, link) {
  return '<div class="ent' + (link ? " link" : "") + '"><b>' + name + "</b>" + fields.map(function (f) {
    var m = f.match(/^(pk|fk|pkfk):(.*)$/);
    return m ? '<span class="' + m[1] + '">' + m[2] + "</span>" : "<span>" + f + "</span>";
  }).join("") + "</div>";
}
function ARR(label) { return '<div class="arrow"><div>' + (label || "1 → ∞") + '</div><div class="ln">⟶</div></div>'; }
function QBE(cols, title) {
  var rows = ["Field", "Table", "Total", "Sort", "Show", "Criteria", "or"];
  var keys = ["f", "t", "tot", "s", "sh", "c", "or"];
  var useTotal = cols.some(function (c) { return c.tot; });
  var h = (title ? '<div class="qbe-title">' + title + "</div>" : "") + '<div class="tbl-wrap"><table class="qbe">';
  rows.forEach(function (r, i) {
    if (r === "Total" && !useTotal) return;
    h += "<tr><th>" + r + ":</th>" + cols.map(function (c) {
      var v = c[keys[i]];
      if (r === "Show") v = c.sh === false ? "☐" : "☑";
      return "<td>" + (v || "") + "</td>";
    }).join("") + "</tr>";
  });
  return h + "</table></div>";
}

/* Elmwood Cookery School dataset – used on Days 2, 6 and 7 */
var ELM = {
  head: ["Chef ID", "Chef Name", "Course ID", "Course Name", "Day", "Course Price", "Learner ID", "Learner Name", "Learner Phone", "Booking Date", "Deposit Paid"],
  rows: [
    ["CH1", "Rosa Bianchi", "K01", "Italian Basics", "Monday", "£45.00", "L01", "Omar Haddad", "07700 900111", "03/09/2025", "Yes"],
    ["CH1", "Rosa Bianchi", "K01", "Italian Basics", "Monday", "£45.00", "L02", "Grace Kim", "07700 900222", "05/09/2025", "No"],
    ["CH1", "Rosa Bianchi", "K02", "Fresh Pasta", "Wednesday", "£50.00", "L01", "Omar Haddad", "07700 900111", "10/09/2025", "Yes"],
    ["CH2", "Dev Sharma", "K03", "Curry Masterclass", "Tuesday", "£55.00", "L03", "Ella Brooks", "07700 900333", "12/09/2025", "Yes"],
    ["CH2", "Dev Sharma", "K03", "Curry Masterclass", "Tuesday", "£55.00", "L02", "Grace Kim", "07700 900222", "15/09/2025", "Yes"],
    ["CH2", "Dev Sharma", "K03", "Curry Masterclass", "Tuesday", "£55.00", "L04", "Finn O'Neill", "07700 900444", "01/10/2025", "No"],
    ["CH3", "Mei Tanaka", "K04", "Sushi Skills", "Thursday", "£60.00", "L05", "Zara Ahmed", "07700 900555", "02/10/2025", "Yes"],
    ["CH3", "Mei Tanaka", "K04", "Sushi Skills", "Thursday", "£60.00", "L01", "Omar Haddad", "07700 900111", "06/10/2025", "No"],
    ["CH3", "Mei Tanaka", "K05", "Baking Bread", "Saturday", "£40.00", "L04", "Finn O'Neill", "07700 900444", "14/10/2025", "Yes"],
    ["CH1", "Rosa Bianchi", "K02", "Fresh Pasta", "Wednesday", "£50.00", "L05", "Zara Ahmed", "07700 900555", "20/10/2025", "No"]
  ]
};
ELM.table = function () { return T(ELM.head, ELM.rows); };
ELM.tables = function () {
  return '<div class="erd">' +
    ENT("tblChef", ["pk:Chef ID", "Chef Name"]) + ARR("1 → ∞") +
    ENT("tblCourse", ["pk:Course ID", "Course Name", "Day", "Course Price", "fk:Chef ID"]) + ARR("1 → ∞") +
    ENT("tblBooking", ["pkfk:Learner ID", "pkfk:Course ID", "Booking Date", "Deposit Paid"], true) + '<div class="arrow"><div>∞ ← 1</div><div class="ln">⟵</div></div>' +
    ENT("tblLearner", ["pk:Learner ID", "Learner Name", "Learner Phone"]) + "</div>";
};

COURSE.days.push({
  id: "d1", n: 1, week: 1, short: "Reading the scenario",
  title: "Reading the scenario: entities and relationships",
  activity: "Activity 1", time: "60–75 mins",
  intro: "Activity 1 always starts with a short scenario and a flat file (Figure 1). Before you can design any tables, you have to read the wording and work out <b>what things</b> the business keeps records about, and <b>how they link</b>. That's today.",
  blocks: [
    { t: "learn", title: "What Activity 1 actually asks you to do", html:
      "<p>You get a short story about a business and <b>Figure 1</b> — one big table with everything crammed into it (a <b>flat file</b>). Your job is to split it into a set of linked tables: give each table a name, its fields, its <b>primary key</b>, any <b>foreign keys</b>, and the <b>relationships</b> between the tables.</p>" +
      "<p>The pattern you'll see again and again in the real papers:</p><ul>" +
      "<li>Figure 1 usually gives you <b>two or three ID columns</b> (e.g. Coach ID, Session ID, Member ID). Each ID is a big clue: <b>every ID becomes the primary key of its own table.</b></li>" +
      "<li>Then there is <b>one more table you have to think of yourself</b> — the one that links two of the others. It isn't given its own ID. Spotting it is where most of the marks are won or lost.</li></ul>" },

    { t: "learn", title: "Entities and attributes", html:
      "<p>An <b>entity</b> is a <i>thing the business keeps records about</i> — usually a person, an object or an event. Each entity becomes a <b>table</b>.</p>" +
      "<p>An <b>attribute</b> is a <i>fact about</i> an entity. Each attribute becomes a <b>field</b> (a column).</p>" +
      "<p><b>Quick test:</b> does this word have its own details that you'd want to store? If yes → entity. If it <i>is</i> a detail → attribute.</p>" +
      "<p>Example: <i>\"The gym records each <mark class='ent'>member</mark>'s <mark class='att'>name</mark> and <mark class='att'>phone number</mark>, and the <mark class='ent'>classes</mark> they attend, including the <mark class='att'>day</mark> and <mark class='att'>start time</mark>.\"</i></p>" +
      "<p>Entities (yellow): Member, Class. Attributes (blue): name, phone number, day, start time.</p>" },

    { t: "learn", title: "The three ways two entities can link", html:
      "<p><b>1. One-to-many (1:M)</b> — the most common. <i>\"A coach can run <mark class='rel'>several</mark> classes, but <mark class='rel'>each class has one</mark> coach.\"</i> Look at the data: the coach repeats, the class doesn't.</p>" +
      T(["Class ID", "Class Name", "Coach ID", "Coach Name"], [["C1", "Spin", { v: "K1" }, { v: "Jo Adams" }], ["C2", "Yoga", { v: "K1" }, { v: "Jo Adams" }], ["C3", "Boxfit", "K2", "Raj Patel"]]) +
      "<p>K1 appears twice (one coach → many classes). Each class has only one coach. <b>The foreign key goes in the 'many' table</b>: Coach ID goes into the Class table.</p>" +
      "<p><b>2. Many-to-many (M:M)</b> — <i>\"A member can attend <mark class='rel'>more than one</mark> class, and a class has <mark class='rel'>several</mark> members.\"</i> Both sides repeat:</p>" +
      T(["Member ID", "Member Name", "Class ID", "Class Name"], [[{ v: "M1" }, { v: "Amy" }, "C1", "Spin"], [{ v: "M1" }, { v: "Amy" }, { v: "C2", c: "hl2" }, { v: "Yoga", c: "hl2" }], ["M2", "Ben", { v: "C2", c: "hl2" }, { v: "Yoga", c: "hl2" }]]) +
      "<p>M1 has two classes; C2 has two members. Access <b>cannot</b> store this directly — you must add a <b>link table</b> (also called a junction table) in the middle, which turns one M:M into <b>two 1:M</b> relationships.</p>" +
      "<p><b>3. One-to-one (1:1)</b> — rare in this exam. One record matches exactly one record on the other side (e.g. a country and its capital city).</p>" },

    { t: "learn", title: "The two-question test (use it every time)", html:
      "<p>For any two entities A and B, ask both questions:</p>" +
      T(["Can one A have many B?", "Can one B have many A?", "Relationship", "What you do"], [
        ["Yes", "No", "One-to-many (A is the 'one')", "Put A's ID into B's table as a foreign key"],
        ["No", "Yes", "One-to-many (B is the 'one')", "Put B's ID into A's table as a foreign key"],
        ["Yes", "Yes", "<b>Many-to-many</b>", "Create a <b>link table</b> holding both IDs"],
        ["No", "No", "One-to-one", "Rare – usually merge or link by the same key"]]) +
      "<p><b>Words that mean 'many':</b> more than one, several, a number of, any number of, multiple, can … many.<br><b>Words that mean 'one':</b> only one, exactly one, a single, each … is run by one.</p>" },

    { t: "learn", title: "Where does a field go? Ask: \"whose fact is it?\"", html:
      "<p>Some facts belong to neither side of a many-to-many on its own — they belong to the <b>pairing</b>. Look at this data:</p>" +
      T(["Member", "Class", "Grade awarded"], [[{ v: "Amy" }, "Spin", { v: "Merit", c: "hl2" }], [{ v: "Amy" }, "Yoga", { v: "Pass", c: "hl2" }]]) +
      "<p>Same member, <b>different grade</b>. So 'Grade awarded' is not a fact about Amy (she'd have one grade) and not a fact about the class (everyone would get the same). It's a fact about <b>Amy-in-that-class</b> → it goes in the <b>link table</b>.</p>" +
      "<p>Compare Amy's phone number: it's the same on every row → it's a fact about Amy → Member table.</p>" },

    { t: "scenario", title: "Worked example – Westbrook Music School", html:
      "<p><i>\"Westbrook Music School runs instrument <mark class='ent'>courses</mark>. A <mark class='ent'>tutor</mark> can teach <mark class='rel'>more than one course</mark>, but <mark class='rel'>every course is taught by one tutor only</mark>. <mark class='ent'>Students</mark> can join <mark class='rel'>more than one course</mark>, and <mark class='rel'>each course has several students</mark>. When a student joins a course, the school records <mark class='att'>whether they have paid the fee for that course</mark>.\"</i></p>" +
      "<p><b>Entities:</b> Tutor, Course, Student.</p>" +
      "<p><b>Tutor ↔ Course:</b> one tutor → many courses; one course → one tutor. <b>One-to-many.</b> Tutor ID goes into tblCourse as a foreign key.</p>" +
      "<p><b>Student ↔ Course:</b> one student → many courses; one course → many students. <b>Many-to-many</b> → link table <b>tblEnrolment</b>.</p>" +
      "<p><b>'Paid the fee for that course':</b> the words <i>for that course</i> tell you it's about the pairing → tblEnrolment.</p>" +
      '<div class="erd">' + ENT("tblTutor", ["pk:Tutor ID", "Tutor Name"]) + ARR() + ENT("tblCourse", ["pk:Course ID", "Instrument", "fk:Tutor ID"]) + ARR() +
      ENT("tblEnrolment", ["pkfk:Student ID", "pkfk:Course ID", "Fee Paid"], true) + '<div class="arrow"><div>∞ ← 1</div><div class="ln">⟵</div></div>' + ENT("tblStudent", ["pk:Student ID", "Student Name"]) + "</div>" +
      "<p class='notice'>Notice: four tables. Three were obvious from the IDs. The fourth (tblEnrolment) had to be worked out — and it has no ID of its own.</p>" },

    { t: "h", text: "Practise", sub: "Answer, press Check, and read the explanation every time — even when you're right." },

    { t: "mcq", q: "Which of these is an <b>entity</b> (it would become a table)?", opts: ["Surname", "Customer", "Date of birth", "Price"], a: 1,
      why: "A customer is a thing the business keeps records about — it has its own details (surname, date of birth…). The other three are details <i>about</i> something, so they're attributes (fields)." },

    { t: "multi", q: "<i>\"A garage records each mechanic's name and phone number, and each repair job the mechanic carries out, including the date and the cost.\"</i><br>Which of these are <b>entities</b>?", opts: ["Mechanic", "Repair job", "Phone number", "Cost", "Date"], a: [0, 1],
      why: "Mechanic and Repair job each have their own details. Phone number belongs to the mechanic; date and cost belong to the repair job." },

    { t: "match", q: "A hotel booking system. Is each one an <b>entity</b> (table) or an <b>attribute</b> (field)?", lh: "Word", rh: "Entity or attribute?",
      items: [["Guest", "Entity"], ["Room", "Entity"], ["Room price", "Attribute"], ["Guest email", "Attribute"], ["Booking", "Entity"], ["Check-in date", "Attribute"]],
      choices: ["Entity", "Attribute"],
      why: "Guest, Room and Booking all have details of their own. Room price is a fact about a room, guest email about a guest, and check-in date about a booking. Events like a <i>booking</i> are entities too — they're often the link table." },

    { t: "mcq", q: "<i>\"Each driving instructor teaches many learners, but each learner has only one instructor.\"</i> What is the relationship between Instructor and Learner?", opts: ["One-to-one", "One-to-many (one instructor, many learners)", "One-to-many (one learner, many instructors)", "Many-to-many"], a: 1,
      why: "Two-question test: one instructor → many learners (yes); one learner → many instructors (no — 'only one'). So 1:M with Instructor on the 'one' side." },

    { t: "mcq", q: "<i>\"A student can borrow many library books over the year, and the same book can be borrowed by many different students.\"</i> Relationship between Student and Book?", opts: ["One-to-one", "One-to-many", "Many-to-many", "There is no relationship"], a: 2,
      why: "Both questions answer 'yes' → many-to-many. You'd need a link table (e.g. tblLoan) holding Student ID and Book ID." },

    { t: "mcq", q: "In a one-to-many relationship between <b>tblCustomer</b> (one) and <b>tblOrder</b> (many), where does the foreign key go?", opts: ["Order ID goes into tblCustomer", "Customer ID goes into tblOrder", "Both tables get each other's ID", "A link table is needed"], a: 1,
      why: "The foreign key always sits in the <b>many</b> table. Each order stores which customer it belongs to. (If tblCustomer stored Order IDs, a customer with 5 orders would need 5 fields — that breaks the rules.)" },

    { t: "match", q: "Use the two-question test. What is each relationship?", lh: "Pair (and the facts)", rh: "Relationship",
      items: [
        ["Team ↔ Player<br><small>A team has many players; a player plays for one team.</small>", "One-to-many"],
        ["Course ↔ Student<br><small>A student takes several courses; a course has many students.</small>", "Many-to-many"],
        ["Country ↔ Capital city<br><small>Each country has one capital; each capital belongs to one country.</small>", "One-to-one"],
        ["Author ↔ Book<br><small>An author writes many books; some books have several authors.</small>", "Many-to-many"],
        ["Vet ↔ Appointment<br><small>A vet has many appointments; each appointment is with one vet.</small>", "One-to-many"]],
      choices: ["One-to-one", "One-to-many", "Many-to-many"],
      why: "If both sides can have 'many', it's many-to-many — even if only <i>some</i> books have several authors. One exception is enough." },

    { t: "multi", q: "Which phrases in a scenario tell you that a side is <b>many</b>?", opts: ["\"more than one\"", "\"several\"", "\"exactly one\"", "\"a number of\"", "\"only one\"", "\"any number of\""], a: [0, 1, 3, 5],
      why: "'Exactly one' and 'only one' mean the <b>one</b> side. Underline these words when you read the real scenario." },

    { t: "scenario", title: "Look at the data – Clayworks Pottery Club", html:
      "<p>Here is part of a flat file. Use the data itself (not just the wording) to spot relationships.</p>" +
      T(["Member ID", "Member Name", "Class ID", "Class Name", "Teacher ID", "Teacher Name"], [
        ["M01", "Ava Stone", "C1", "Wheel Throwing", "T1", "Mr Okafor"],
        ["M02", "Ben Hale", "C1", "Wheel Throwing", "T1", "Mr Okafor"],
        ["M01", "Ava Stone", "C2", "Glazing", "T1", "Mr Okafor"],
        ["M03", "Cara Wu", "C2", "Glazing", "T1", "Mr Okafor"],
        ["M02", "Ben Hale", "C3", "Hand Building", "T2", "Ms Li"]]) },

    { t: "mcq", q: "Look at Member ID and Class ID in the Clayworks data. What does the data prove?", opts: ["Each member only does one class", "Each class only has one member", "A member can do more than one class AND a class can have more than one member", "Members and classes are not linked"], a: 2,
      why: "M01 appears with C1 and C2 (one member → many classes). C1 appears with M01 and M02 (one class → many members). Both sides repeat → many-to-many." },

    { t: "mcq", q: "Now look at Class ID and Teacher ID. What's the relationship between Teacher and Class?", opts: ["Many-to-many", "One-to-many: one teacher, many classes", "One-to-many: one class, many teachers", "One-to-one"], a: 1,
      why: "T1 teaches C1 and C2, but every class only ever has one teacher (C1 is always T1). So Teacher (1) → Class (many). Teacher ID becomes a foreign key in tblClass." },

    { t: "mcq", q: "How many tables should the Clayworks design have?", opts: ["3 – Member, Class, Teacher", "4 – Member, Class, Teacher and a link table between Member and Class", "4 – Member, Class, Teacher and a link table between Teacher and Class", "2 – Member and Class"], a: 1,
      why: "Three IDs → three tables. Member↔Class is many-to-many, so you need a fourth, link table (e.g. tblMembership with Member ID + Class ID). Teacher↔Class is only 1:M, so no link table is needed there." },

    { t: "match", q: "Clayworks: which table does each field belong in?", lh: "Field", rh: "Table",
      items: [["Member phone number", "tblMember"], ["Class day", "tblClass"], ["Date the member joined <i>that</i> class", "tblMembership"], ["Teacher email", "tblTeacher"], ["Kiln fee paid for <i>that</i> class (Yes/No)", "tblMembership"], ["Class name", "tblClass"], ["Member date of birth", "tblMember"]],
      choices: ["tblMember", "tblClass", "tblTeacher", "tblMembership"],
      why: "Ask 'whose fact is it?'. Anything described as 'for that class' / 'each time they join' depends on the <b>pair</b> (member + class), so it goes in the link table." },

    { t: "mcq", q: "A school records students and the exams they sit. A student sits many exams; each exam is sat by many students. Where should <b>Grade Achieved</b> be stored?", opts: ["tblStudent – it's about the student", "tblExam – it's about the exam", "The link table (e.g. tblResult) – it's about one student in one exam", "In both tblStudent and tblExam"], a: 2,
      why: "One student gets a different grade in each exam, and one exam gives different grades to different students. So the grade belongs to the pairing → link table." },

    { t: "text", mode: "word", q: "<i>\"A customer can place more than one order. Each order is placed by one customer.\"</i><br>Which entity is on the <b>many</b> side? (one word)", accept: ["order", "orders"], ph: "e.g. Customer",
      why: "One customer → many orders. So Order is the 'many' side, and tblOrder holds Customer ID as a foreign key." },

    { t: "scenario", title: "Mini scenario – Sunnyside Dog Walkers", html:
      "<p><i>\"Sunnyside employs several walkers. Each walker is assigned to a number of dogs, and a dog can be assigned to more than one walker. Every dog belongs to one owner, although an owner may have more than one dog. For each assignment, the company records the weekday the walk happens.\"</i></p>" },

    { t: "match", q: "Sunnyside: what are the relationships?", lh: "Pair", rh: "Relationship",
      items: [["Owner ↔ Dog", "One-to-many"], ["Walker ↔ Dog", "Many-to-many"], ["Walker ↔ Owner", "No direct relationship"]],
      choices: ["One-to-many", "Many-to-many", "One-to-one", "No direct relationship"],
      why: "Owner → many dogs; each dog has one owner (1:M). Walkers ↔ dogs: both sides 'more than one' (M:M). Walkers and owners aren't linked directly in the wording — they only connect through dogs." },

    { t: "mcq", q: "Sunnyside: which table should hold <b>Walk Weekday</b>?", opts: ["tblWalker", "tblDog", "tblOwner", "The link table between Walker and Dog (e.g. tblAssignment)"], a: 3,
      why: "\"For each assignment\" = for each walker–dog pair. Different pairs walk on different days, so it's a fact about the pairing." },

    { t: "mcq", q: "Sunnyside: Figure 1 gives Owner ID, Dog ID and Walker ID. Which table will <b>not</b> have an ID column of its own in Figure 1?", opts: ["tblOwner", "tblDog", "tblWalker", "tblAssignment (the link table)"], a: 3,
      why: "This is the classic exam pattern: three IDs given, and the fourth (link) table has to be worked out. Its primary key is made from the two IDs it links: Walker ID + Dog ID." },

    { t: "tip", title: "What to take into tomorrow", html: "<ul><li>Every ID in Figure 1 → its own table.</li><li>Two-question test on every pair. Yes/Yes → link table.</li><li>'For that…', 'each time…', 'for each assignment/booking/enrolment' → field goes in the link table.</li><li>Foreign keys live on the <b>many</b> side.</li></ul>" }
  ]
});

COURSE.days.push({
  id: "d2", n: 2, week: 1, short: "Flat file → tables & keys",
  title: "From flat file to tables: keys and the 'fourth table'",
  activity: "Activity 1", time: "75–90 mins",
  intro: "Yesterday you learned to read the relationships. Today you turn a real flat file into a finished table design — with primary keys, foreign keys and the composite key on the link table — using a six-step method you can repeat in the exam.",
  blocks: [
    { t: "learn", title: "Why the flat file is a problem", html:
      "<p>A flat file repeats the same facts over and over. That causes three classic problems (called <b>anomalies</b>):</p><ul>" +
      "<li><b>Update anomaly</b> – a learner's phone number is stored on three rows. Change it on one and forget the others → the data now disagrees with itself.</li>" +
      "<li><b>Insertion anomaly</b> – you can't add a new course until somebody books it, because every row needs a learner.</li>" +
      "<li><b>Deletion anomaly</b> – delete the only booking for a course and you lose the course details (and maybe the chef) too.</li></ul>" +
      "<p>Splitting into linked tables means <b>each fact is stored once</b>. That's the whole point of Activity 1 — and it's the first thing to say in your Activity 5 evaluation.</p>" },

    { t: "learn", title: "The six-step method", html:
      "<ol>" +
      "<li><b>Circle every ID column.</b> Each one is the primary key of its own table.</li>" +
      "<li><b>For every other field ask \"what is this a fact about?\"</b> and move it next to that ID. Check the data: if the value never changes for the same ID, it belongs to that ID.</li>" +
      "<li><b>Two-question test</b> on each pair of entities.</li>" +
      "<li><b>One-to-many:</b> copy the 'one' table's primary key into the 'many' table as a <b>foreign key</b>.</li>" +
      "<li><b>Many-to-many:</b> create a <b>link table</b>. It holds both IDs. Together they form a <b>composite primary key</b>, and each one is also a foreign key.</li>" +
      "<li><b>Facts about the pairing</b> (e.g. 'for that booking') go in the link table.</li></ol>" },

    { t: "learn", title: "Keys – the words you must use correctly", html:
      T(["Term", "Meaning", "Example"], [
        ["<b>Primary key (PK)</b>", "Uniquely identifies each record. No duplicates, never blank.", "Learner ID in tblLearner"],
        ["<b>Foreign key (FK)</b>", "A field that holds another table's primary key, to link the two.", "Chef ID in tblCourse"],
        ["<b>Composite key</b>", "A primary key made of two (or more) fields together.", "Learner ID + Course ID in tblBooking"],
        ["<b>Link / junction table</b>", "The table that breaks a many-to-many into two one-to-manys.", "tblBooking"]]) +
      "<p><b>Why a composite key and not a new AutoNumber 'Booking ID'?</b> The composite key makes Access refuse a second record with the same Learner ID + Course ID — so the same learner can't be booked onto the same course twice. With an AutoNumber key, every new row gets a fresh number, so a duplicate booking would be <i>accepted</i>. Examiners reward the composite key on the link table when the brief doesn't give the table an ID.</p>" },

    { t: "tip", title: "When would a link table have its own ID?", html:
      "<p>Only when the <b>same pair can happen more than once</b> – e.g. the same pet sees the same vet on several different dates. Then Pet ID + Vet ID would repeat, so it can't be the primary key. In that case the brief normally gives you an ID (Appointment ID). If the brief gives you no ID for the link table, use the composite key.</p>" },

    { t: "scenario", title: "Scenario – Elmwood Cookery School (you'll use this again on Days 6 and 7)", html:
      "<p><i>\"Elmwood Cookery School runs cookery courses. Each course is run by one chef, although a chef can run more than one course. Learners can book onto more than one course, and each course has several learners. When a learner books a course, the school records the date of the booking and whether a deposit has been paid for that booking.\"</i></p>" +
      "<p><b>Figure 1 – the flat file</b></p>" + ELM.table() },

    { t: "h", text: "Practise – Elmwood Cookery School" },

    { t: "multi", q: "Step 1: which columns in Figure 1 are <b>ID columns</b> that will each become the primary key of their own table?", opts: ["Chef ID", "Course ID", "Learner ID", "Learner Phone", "Booking Date"], a: [0, 1, 2],
      why: "Three IDs → three tables: tblChef, tblCourse, tblLearner. The fourth table (for bookings) has no ID in Figure 1 — you'll build its key in a moment." },

    { t: "match", q: "Step 2: for each field, which table is it a <b>fact about</b>?", lh: "Field", rh: "Home table",
      items: [["Chef Name", "tblChef"], ["Course Name", "tblCourse"], ["Day", "tblCourse"], ["Course Price", "tblCourse"], ["Learner Name", "tblLearner"], ["Learner Phone", "tblLearner"], ["Booking Date", "tblBooking"], ["Deposit Paid", "tblBooking"]],
      choices: ["tblChef", "tblCourse", "tblLearner", "tblBooking"],
      why: "Check with the data: K01 is <i>always</i> Monday and £45 → Day and Course Price belong to the course. Omar's phone is the same on every row → tblLearner. But Omar's Deposit Paid is Yes for K01, Yes for K02 and No for K04 — it changes per booking → tblBooking." },

    { t: "mcq", q: "Why does <b>Learner Phone</b> NOT go in the booking table?", opts: ["Because phone numbers are text", "Because it's the same for a learner whatever course they book – it's a fact about the learner", "Because it isn't an ID", "Because the exam says so"], a: 1,
      why: "Omar Haddad's phone (07700 900111) appears on three rows and never changes. Storing it in tblBooking would repeat it for every booking — exactly the redundancy we're trying to remove." },

    { t: "match", q: "Steps 3 and 4: what are the relationships?", lh: "Pair", rh: "Relationship",
      items: [["Chef ↔ Course", "One-to-many"], ["Learner ↔ Course", "Many-to-many"], ["Chef ↔ Learner", "No direct relationship"]],
      choices: ["One-to-one", "One-to-many", "Many-to-many", "No direct relationship"],
      why: "CH1 runs K01 and K02, but each course has one chef → 1:M. L01 books K01, K02, K04, and K01 has L01 and L02 → M:M. Chefs and learners only connect through courses." },

    { t: "mcq", q: "What should the primary key of <b>tblBooking</b> be?", opts: ["Learner ID", "Course ID", "Learner ID + Course ID together (composite key)", "A new AutoNumber field called Booking ID"], a: 2,
      why: "Neither ID is unique on its own (L01 has three bookings; K01 has two). But each <b>pair</b> appears only once – so the pair is the primary key." },

    { t: "mcq", q: "A student gives tblBooking an AutoNumber <b>Booking ID</b> as its primary key and stores Learner ID and Course ID as ordinary fields. What's the main weakness?", opts: ["It won't let you create relationships", "Access would accept the same learner being booked onto the same course twice", "AutoNumber can't be a primary key", "Nothing – it's exactly the same"], a: 1,
      why: "The design still works, but every row gets a new Booking ID, so nothing stops a duplicate Learner ID + Course ID pair. The composite key stops that automatically — that's the reason to give in the exam." },

    { t: "match", q: "What role does each field play?", lh: "Field (in which table)", rh: "Key role",
      items: [["Chef ID in tblChef", "Primary key"], ["Chef ID in tblCourse", "Foreign key"], ["Course ID in tblCourse", "Primary key"], ["Course ID in tblBooking", "Part of composite primary key + foreign key"], ["Learner ID in tblBooking", "Part of composite primary key + foreign key"], ["Course Name in tblCourse", "Not a key"]],
      choices: ["Primary key", "Foreign key", "Part of composite primary key + foreign key", "Not a key"],
      why: "In a link table, each of the two IDs is doing two jobs at once: half of the primary key, and a foreign key pointing back to its own table." },

    { t: "grid", q: "How many records (rows) will each table have once the data from Figure 1 is split up? Count the <b>unique</b> values.", head: ["Table", "Number of records"],
      rows: [["tblChef", { accept: ["3"], mode: "num" }], ["tblCourse", { accept: ["5"], mode: "num" }], ["tblLearner", { accept: ["5"], mode: "num" }], ["tblBooking", { accept: ["10"], mode: "num" }]],
      why: "3 chefs (CH1–CH3), 5 courses (K01–K05), 5 learners (L01–L05). tblBooking keeps one row per booking, so it has all 10. This is the proof that splitting removes repetition: Omar's details are now stored once, not three times." },

    { t: "multi", q: "Which problems would happen if Elmwood kept using the flat file?", opts: ["If Omar changes his phone number it must be changed on three rows, or the data disagrees (update anomaly)", "A brand-new course can't be added until a learner books it (insertion anomaly)", "If the only Baking Bread booking is deleted, the course details are lost too (deletion anomaly)", "Access can't open flat files", "Searches become impossible"], a: [0, 1, 2],
      why: "These three anomalies are the classic reasons for normalising. Access <i>can</i> open and search a flat file – it's the repetition that causes the problems." },

    { t: "grid", q: "Complete the design. Choose the primary key and foreign key(s) for each table.", head: ["Table", "Primary key", "Foreign key(s)"],
      rows: [
        ["tblChef", { sel: ["Chef ID", "Course ID", "Learner ID", "Learner ID + Course ID", "Booking Date"], a: "Chef ID" }, { sel: ["None", "Chef ID", "Course ID", "Learner ID", "Learner ID and Course ID"], a: "None" }],
        ["tblCourse", { sel: ["Chef ID", "Course ID", "Learner ID", "Learner ID + Course ID", "Booking Date"], a: "Course ID" }, { sel: ["None", "Chef ID", "Course ID", "Learner ID", "Learner ID and Course ID"], a: "Chef ID" }],
        ["tblLearner", { sel: ["Chef ID", "Course ID", "Learner ID", "Learner ID + Course ID", "Booking Date"], a: "Learner ID" }, { sel: ["None", "Chef ID", "Course ID", "Learner ID", "Learner ID and Course ID"], a: "None" }],
        ["tblBooking", { sel: ["Chef ID", "Course ID", "Learner ID", "Learner ID + Course ID", "Booking Date"], a: "Learner ID + Course ID" }, { sel: ["None", "Chef ID", "Course ID", "Learner ID", "Learner ID and Course ID"], a: "Learner ID and Course ID" }]],
      why: "Here's the finished design:" + ELM.tables() + "Three relationships, all one-to-many: tblChef→tblCourse, tblCourse→tblBooking, tblLearner→tblBooking." },

    { t: "mcq", q: "Should <b>Chef ID</b> also go in tblBooking, so you can see which chef each booking is with?", opts: ["Yes – it saves a step", "No – you can already find the chef through Course ID → tblCourse, so adding it would repeat data", "Yes – every table needs every ID", "No – foreign keys can't go in link tables"], a: 1,
      why: "The chef is a fact about the course, not the booking. Storing it again in tblBooking brings back the repetition you've just removed (and the chef could end up disagreeing with tblCourse)." },

    { t: "mcq", q: "Spot the mistake. A student's tblCourse is: <code>Course ID (PK), Course Name, Day, Course Price, Chef ID (FK), Learner ID (FK)</code>. What's wrong?", opts: ["Course Price should be in tblChef", "Learner ID can't go in tblCourse – a course has many learners, so it would need many Learner IDs; that's why tblBooking exists", "Chef ID should be the primary key", "Nothing is wrong"], a: 1,
      why: "A field can only hold one value per record. K03 has three learners, so tblCourse would need three rows for the same course (repetition again). Many-to-many always needs the link table." },

    { t: "scenario", title: "Stretch – Harbour View Vets", html:
      "<p><i>\"Pets are registered with the practice. Each pet has one owner, and an owner may have several pets. Pets can be seen by any of the vets. Every visit is booked as an appointment with a date and time, and a pet can see the same vet many times.\"</i></p>" +
      T(["Appointment ID", "Appt Date", "Pet ID", "Pet Name", "Owner ID", "Owner Name", "Vet ID", "Vet Name"], [
        ["A101", "04/11/2025", "P1", "Biscuit", "O1", "J. Rowe", "V1", "Dr Sato"],
        ["A102", "04/11/2025", "P2", "Luna", "O1", "J. Rowe", "V2", "Dr Klein"],
        ["A103", "18/11/2025", "P1", "Biscuit", "O1", "J. Rowe", "V1", "Dr Sato"]]) },

    { t: "mcq", q: "Harbour View: Pet and Vet are many-to-many. Why is <b>Pet ID + Vet ID NOT</b> a good primary key for the appointments table here?", opts: ["Because Pet ID is text", "Because the same pet can see the same vet more than once (P1 + V1 appears twice), so the pair isn't unique", "Because vets don't need IDs", "Because composite keys are never allowed"], a: 1,
      why: "A101 and A103 are both P1 + V1. A primary key must be unique, so the pair fails. That's why the brief gives you Appointment ID here: tblAppointment(Appointment ID PK, Appt Date, Pet ID FK, Vet ID FK)." },

    { t: "mcq", q: "So how do you decide between a composite key and the link table's own ID?", opts: ["Always use a composite key", "Always add an AutoNumber", "If each pair can only happen once and no ID is given → composite key. If the same pair can repeat (or an ID is given) → use the ID", "Use whichever has fewer characters"], a: 2,
      why: "This is the reasoning examiners look for. In most Unit 2 papers the link table has no ID and each pair happens once → composite key." },

    { t: "tip", title: "How to set out your Activity 1 answer", html:
      "<p>For each table write: <b>table name</b> (use the <code>tbl</code> prefix), every <b>field</b> (use Figure 1's field names exactly), and label the <b>PK</b> and any <b>FK</b>. Then list each relationship: <i>tblChef (1) → (∞) tblCourse on Chef ID</i>. In Access you'd also tick <b>Enforce Referential Integrity</b> on each relationship — mention that you would.</p>" }
  ]
});

COURSE.days.push({
  id: "d3", n: 3, week: 1, short: "Data types & properties",
  title: "Data types and field properties",
  activity: "Activity 2", time: "60–75 mins",
  intro: "Activity 2 is where you build your tables in Access. Even without Access at home, almost every mark comes from <b>decisions</b>: the right data type, the right field size, the right property for each requirement. Today: data types and the properties panel.",
  blocks: [
    { t: "learn", title: "What Activity 2 asks", html:
      "<p>You create the tables from Activity 1 in Access, choose a <b>data type</b> and sensible <b>field size</b> for every field, set the <b>primary keys</b>, and then add the <b>validation</b> the brief asks for (input masks, validation rules, lookups, required fields). You evidence it with screenshots of Design View and of each check working.</p>" +
      "<p>In Design View every field has a name, a data type, and underneath, a <b>Field Properties</b> panel. Today is about choosing those correctly; tomorrow is validation.</p>" },

    { t: "learn", title: "Choosing the data type", html:
      T(["Data type", "Use it for", "Watch out"], [
        ["<b>Short Text</b>", "Names, codes, IDs like CH1, phone numbers, postcodes – anything not used in maths. Up to 255 characters.", "Set the Field Size – default is 255."],
        ["<b>Long Text</b>", "Notes and comments longer than 255 characters.", "Rarely needed in the exam."],
        ["<b>Number</b>", "Quantities you do maths with: ages, number of seats.", "Field Size <b>Integer</b>/<b>Long Integer</b> = whole numbers only. Use <b>Double</b> for decimals."],
        ["<b>Currency</b>", "Money – prices, fees, costs.", "Not Number: Currency avoids rounding errors and shows £."],
        ["<b>Date/Time</b>", "Dates and times.", "Set Format, e.g. Short Date (dd/mm/yyyy) or Short Time."],
        ["<b>Yes/No</b>", "Anything with only two answers: Paid? Passed?", "Shows as a tick box."],
        ["<b>AutoNumber</b>", "A primary key Access numbers for you (1, 2, 3…).", "Only if the IDs are plain numbers. IDs like 'CH1' are Short Text."]]) },

    { t: "learn", title: "Three traps that cost marks every year", html:
      "<p><b>1. Phone numbers are Short Text, not Number.</b> A Number field throws away the leading zero (07700… becomes 7700…) and can't store spaces. You never do maths on a phone number.</p>" +
      "<p><b>2. Money is Currency, not Number Integer.</b> Integer can only store whole numbers, so £12.50 would be stored as 13.</p>" +
      "<p><b>3. A foreign key must match the primary key it points to.</b> If Chef ID in tblChef is Short Text size 3, Chef ID in tblCourse must be Short Text size 3. If the primary key is <b>AutoNumber</b>, the foreign key must be <b>Number – Long Integer</b> (not AutoNumber – you can't have two AutoNumbers deciding the same value).</p>" },

    { t: "learn", title: "The field properties you need", html:
      T(["Property", "What it does", "Example"], [
        ["<b>Field Size</b>", "Max length (text) or number range (numbers).", "Chef ID: 3. Learner Name: 30."],
        ["<b>Format</b>", "How a value is displayed (not what's stored).", "Short Date; Currency"],
        ["<b>Input Mask</b>", "Forces the shape of what's typed.", "<code>>LL0000</code>"],
        ["<b>Caption</b>", "The label shown on forms/datasheets instead of the field name.", "Field LearnerPhone, caption 'Phone'"],
        ["<b>Default Value</b>", "Filled in automatically for new records.", "<code>Date()</code> for today; <code>No</code>"],
        ["<b>Validation Rule</b>", "A condition the value must meet.", "<code>Between 1 And 20</code>"],
        ["<b>Validation Text</b>", "The error message when the rule is broken.", "'Enter a number from 1 to 20'"],
        ["<b>Required</b>", "Yes = can't be left blank (presence check).", "Required: Yes"],
        ["<b>Indexed</b>", "Yes (No Duplicates) = no two records can have the same value.", "Email address"]]) +
      "<p><b>Choosing a field size:</b> look at the longest value in Figure 1 and allow a sensible margin. For fixed-length codes use the exact length (CH1 → 3). Don't leave everything at 255 – examiners notice.</p>" },

    { t: "h", text: "Practise" },

    { t: "grid", q: "Elmwood Cookery School (from Day 2). Choose the best data type for each field.", head: ["Field", "Example from Figure 1", "Data type"],
      rows: [
        ["Chef ID", "CH1", { sel: ["Short Text", "Number", "Currency", "Date/Time", "Yes/No", "AutoNumber"], a: "Short Text" }],
        ["Course Price", "£45.00", { sel: ["Short Text", "Number", "Currency", "Date/Time", "Yes/No", "AutoNumber"], a: "Currency" }],
        ["Day", "Monday", { sel: ["Short Text", "Number", "Currency", "Date/Time", "Yes/No", "AutoNumber"], a: "Short Text" }],
        ["Learner Phone", "07700 900111", { sel: ["Short Text", "Number", "Currency", "Date/Time", "Yes/No", "AutoNumber"], a: "Short Text" }],
        ["Booking Date", "03/09/2025", { sel: ["Short Text", "Number", "Currency", "Date/Time", "Yes/No", "AutoNumber"], a: "Date/Time" }],
        ["Deposit Paid", "Yes", { sel: ["Short Text", "Number", "Currency", "Date/Time", "Yes/No", "AutoNumber"], a: "Yes/No" }],
        ["Learner Name", "Omar Haddad", { sel: ["Short Text", "Number", "Currency", "Date/Time", "Yes/No", "AutoNumber"], a: "Short Text" }]],
      why: "Day is the <i>name</i> of a weekday ('Monday'), not a date, so it's Short Text. Chef ID contains letters, so it can't be AutoNumber or Number." },

    { t: "mcq", q: "Why should <b>Learner Phone</b> be Short Text rather than Number?", opts: ["Number fields can't be searched", "Number would remove the leading 0 and can't store the space – and you never do calculations with it", "Short Text uses less memory", "Phone numbers are always 11 characters"], a: 1,
      why: "This is the most common data-type mistake. Rule of thumb: if you'd never add or multiply it, it's text." },

    { t: "mcq", q: "A student sets Course Price to <b>Number, Field Size Integer</b>. What goes wrong?", opts: ["Nothing", "Prices with pence (e.g. £12.50) would be rounded to whole numbers", "It won't show the £ sign but is otherwise fine", "Access refuses to save the table"], a: 1,
      why: "Integer = whole numbers only. Money should be <b>Currency</b> – exact to the penny and displayed with £." },

    { t: "match", q: "Choose the best data type for each field.", lh: "Field", rh: "Data type",
      items: [["Number of guests on a booking", "Number"], ["Ticket price", "Currency"], ["Date of birth", "Date/Time"], ["Has the member signed the waiver?", "Yes/No"], ["Postcode", "Short Text"], ["Customer ID that Access numbers 1, 2, 3… for you", "AutoNumber"], ["Instructor's notes on each lesson (can be several paragraphs)", "Long Text"]],
      choices: ["Short Text", "Long Text", "Number", "Currency", "Date/Time", "Yes/No", "AutoNumber"],
      why: "Postcode has letters and spaces → Short Text. Number of guests is a quantity you might total → Number. Several paragraphs is longer than 255 characters → Long Text." },

    { t: "mcq", q: "In tblCustomer, <b>Customer ID</b> is an AutoNumber. What data type must <b>Customer ID</b> be in tblOrder (where it's a foreign key)?", opts: ["AutoNumber", "Number – Long Integer", "Short Text", "Number – Double"], a: 1,
      why: "AutoNumber is stored as a Long Integer. The foreign key must match it, so it's Number with Field Size Long Integer. It can't be AutoNumber, because you need to type in which customer the order belongs to." },

    { t: "mcq", q: "Chef ID values are CH1, CH2, CH3. Which Field Size is most sensible?", opts: ["3", "50", "255 (the default)", "Long Integer"], a: 0,
      why: "The codes are exactly three characters. A size of 3 matches the data and stops anyone typing a longer code. (Long Integer is for numbers, not text.)" },

    { t: "match", q: "Which field property meets each requirement?", lh: "Requirement", rh: "Property",
      items: [["Member Email must not be left blank", "Required"], ["Status should show 'Pending' automatically on every new record", "Default Value"], ["No two members can have the same email address", "Indexed – Yes (No Duplicates)"], ["Show a helpful message when the rule is broken", "Validation Text"], ["Rating must be between 1 and 5", "Validation Rule"], ["Surname can be no longer than 30 characters", "Field Size"], ["Display the field heading as 'Phone' instead of LearnerPhone", "Caption"]],
      choices: ["Field Size", "Caption", "Default Value", "Validation Rule", "Validation Text", "Required", "Indexed – Yes (No Duplicates)"],
      why: "Learn these pairings — Activity 2 requirements are written in plain English and you have to translate them into the right property." },

    { t: "text", mode: "expr", q: "What would you type in the <b>Default Value</b> property so that Booking Date fills in with <b>today's date</b> automatically?", accept: ["Date()", "Now()"], show: "Date()", ph: "Type the Access function",
      why: "<code>Date()</code> gives today's date. (<code>Now()</code> also works but includes the time too, so <code>Date()</code> is the better answer for a date field.)" },

    { t: "mcq", q: "What is the maximum Field Size for a Short Text field?", opts: ["50", "100", "255", "No limit"], a: 2,
      why: "255 characters. Anything longer needs Long Text." },

    { t: "multi", q: "Which of these should be stored as <b>Short Text</b>?", opts: ["Phone number", "Postcode", "Price of a ticket", "Car registration (e.g. AB12 CDE)", "Number of seats in a room", "Course code (e.g. K01)"], a: [0, 1, 3, 5],
      why: "Price → Currency. Number of seats → Number (Integer). Everything else is a code or label you'd never do maths with." },

    { t: "mcq", q: "When you set a field as the <b>primary key</b>, what does Access automatically do?", opts: ["Makes it AutoNumber", "Sets Indexed to Yes (No Duplicates) and won't allow it to be blank", "Adds a validation rule", "Creates a relationship"], a: 1,
      why: "A primary key must be unique and present, so Access indexes it with No Duplicates and refuses blanks. You don't need to add a separate validation rule for that." },

    { t: "mcq", q: "Which data type should <b>Session Start Time</b> (e.g. 16:00) be?", opts: ["Short Text", "Number", "Date/Time with Format Short Time", "Currency"], a: 2,
      why: "Times are Date/Time. Setting Format to Short Time displays 16:00. It also lets you write validation rules like <code>Between #09:00# And #20:00#</code> – you can't do that reliably with text." },

    { t: "mcq", q: "Which is the best data type for <b>Distance run (km)</b>, e.g. 5.4?", opts: ["Number – Integer", "Number – Double", "Currency", "Short Text"], a: 1,
      why: "It's a measurement with decimals and you might total or average it → Number with Field Size Double (or Single). Integer would round 5.4 to 5." },

    { t: "grid", q: "Write a sensible <b>Field Size</b> for each Short Text field, using the Figure 1 data from Elmwood.", head: ["Field", "Longest example", "Field Size"],
      rows: [["Course ID", "K01", { accept: ["3"], mode: "num" }], ["Learner ID", "L05", { accept: ["3"], mode: "num" }], ["Learner Phone", "07700 900111 (with the space)", { accept: ["12", "13", "14", "15"], mode: "num", show: "12" }], ["Course Name", "Curry Masterclass (17 characters)", { accept: [/^(1[7-9]|[2-5][0-9]|60)$/], mode: "num", show: "30" }]],
      why: "IDs: exact length. Phone: 11 digits + 1 space = 12 (a little extra is fine). Course Name: at least 17 — something like 30 allows for longer names later. Any sensible size from 17 to 60 is accepted here; in the exam, give a reason." },

    { t: "tip", title: "Exam habit", html: "<p>When you screenshot Design View for Activity 2, make sure the <b>Field Properties</b> panel is visible for the field you're evidencing – the examiner can't award a Field Size or Validation Rule they can't see.</p>" }
  ]
});

COURSE.days.push({
  id: "d4", n: 4, week: 1, short: "Validation & input masks",
  title: "Validation rules, input masks and lookups",
  activity: "Activity 2", time: "90 mins",
  intro: "This is the day that wins Activity 2. The brief describes each check in plain English; you have to recognise which Access feature it needs and write the setting exactly. Learn the decoder first, then practise until the syntax feels automatic.",
  blocks: [
    { t: "learn", title: "The decoder: wording → check → Access feature", html:
      T(["If the brief says…", "Type of check", "Use this in Access"], [
        ["\"must be entered\", \"cannot be left blank\"", "Presence", "<b>Required = Yes</b>"],
        ["\"between…\", \"at least…\", \"no more than…\", \"cannot be in the past\"", "Range", "<b>Validation Rule</b> + Validation Text"],
        ["\"in the format…\", \"two letters followed by four digits\"", "Format / picture", "<b>Input Mask</b>"],
        ["\"must contain @\", \"must start with B\"", "Format (pattern)", "<b>Validation Rule</b> with <code>Like</code>"],
        ["\"must be one of: Small, Medium, Large\"", "List (lookup) – fixed values", "<b>Lookup Wizard → type in the values (Value List)</b>, Limit To List = <b>Yes</b>"],
        ["\"must be a valid Course ID\", \"chosen from the courses table\"", "Lookup to another table (foreign key)", "<b>Lookup Wizard → look up values in a table</b>, Limit To List = <b>No</b>, plus the relationship with referential integrity"],
        ["\"no two … can be the same\"", "Uniqueness", "<b>Indexed = Yes (No Duplicates)</b>"],
        ["\"no longer than 30 characters\"", "Length", "<b>Field Size</b>"]]) },

    { t: "learn", title: "Validation Rule syntax", html:
      T(["Requirement", "Validation Rule"], [
        ["Between 15 and 50 (inclusive)", "<code>Between 15 And 50</code> &nbsp;or&nbsp; <code>&gt;=15 And &lt;=50</code>"],
        ["At least 16", "<code>&gt;=16</code>"],
        ["More than 0", "<code>&gt;0</code>"],
        ["No more than 100", "<code>&lt;=100</code>"],
        ["Today or later (not in the past)", "<code>&gt;=Date()</code>"],
        ["Before today", "<code>&lt;Date()</code>"],
        ["On or after 1 January 2026", "<code>&gt;=#01/01/2026#</code>"],
        ["Between 9am and 8pm", "<code>Between #09:00# And #20:00#</code>"],
        ["One of S, M or L", "<code>In (\"S\",\"M\",\"L\")</code> &nbsp;or&nbsp; <code>\"S\" Or \"M\" Or \"L\"</code>"],
        ["Starts with B", "<code>Like \"B*\"</code>"],
        ["Contains @", "<code>Like \"*@*\"</code>"]]) +
      "<p><b>Rules of the syntax:</b> text goes in <code>\"double quotes\"</code>; dates and times go between <code>#hashes#</code>; numbers have nothing round them. <code>Between</code> includes both ends. 'At least' means <code>&gt;=</code>, not <code>&gt;</code>.</p>" +
      "<p><b>Always add Validation Text</b> that tells the user what to type, e.g. <i>'Age must be 16 or over'</i>. A message like 'Error' or 'Wrong' gets no credit.</p>" },

    { t: "learn", title: "Input masks – build them one character at a time", html:
      T(["Character", "Means"], [["<code>0</code>", "digit, required"], ["<code>9</code>", "digit, optional"], ["<code>L</code>", "letter, required"], ["<code>?</code>", "letter, optional"], ["<code>A</code>", "letter or digit, required"], ["<code>&amp;</code>", "any character, required"], ["<code>&gt;</code>", "make everything after it UPPER CASE"], ["<code>&lt;</code>", "make everything after it lower case"], ["<code>\\</code>", "the next character is shown literally (e.g. <code>\\M</code> = the letter M itself)"]]) +
      "<p><b>Worked example 1:</b> 'Two capital letters followed by four digits, e.g. AB1234'. Capitals → start with <code>&gt;</code>. Two required letters → <code>LL</code>. Four required digits → <code>0000</code>. Answer: <code>&gt;LL0000</code>.</p>" +
      "<p><b>Worked example 2:</b> 'Member ID is the letter M followed by two digits, e.g. M07'. The M is <i>fixed</i> – the user shouldn't have to type it and can't change it – so it's a literal: <code>\\M</code>. Then <code>00</code>. Answer: <code>\\M00</code> (or <code>\"M\"00</code>).<br>⚠️ <code>&gt;L00</code> is <b>wrong</b> here: it would accept <i>any</i> letter, e.g. X07.</p>" +
      "<p><b>Worked example 3:</b> 'Phone number: exactly 11 digits' → <code>00000000000</code> (eleven zeros).</p>" +
      "<p><b>Input mask vs validation rule:</b> an input mask controls the <i>shape</i> (letters/digits in positions). It can't check a <i>range</i> like 'between 1 and 10' – that's a validation rule.</p>" },

    { t: "learn", title: "Lookups and Limit To List – get this right", html:
      "<p>There are two kinds of lookup, and the mark schemes treat <b>Limit To List</b> differently for each:</p>" +
      T(["Kind of lookup", "Example", "Limit To List"], [
        ["<b>Value List</b> – you type the allowed values into the Lookup Wizard", "Day: Monday; Tuesday; Wednesday…", "<b>Yes</b> – otherwise users can type anything"],
        ["<b>Table lookup</b> – the list comes from another table (this field is a foreign key)", "Course ID in tblBooking, looking up tblCourse", "<b>No</b> – the relationship with <b>referential integrity</b> already stops invalid values"]]) +
      "<p>So: a fixed list of words → Value List, Limit To List Yes. A foreign key → lookup to the table, Limit To List No, and make sure the relationship enforces referential integrity.</p>" },

    { t: "h", text: "Practise – validation rules", sub: "Type the exact Validation Rule. Spaces and capital letters don't matter; quotes, hashes and symbols do." },

    { t: "text", mode: "expr", q: "Age must be <b>between 16 and 99</b> (inclusive).", accept: ["Between 16 And 99", ">=16 And <=99", "<=99 And >=16"], show: "Between 16 And 99",
      near: [{ re: /^>16and<99$/, msg: "That leaves out 16 and 99 themselves. 'Inclusive' means use &gt;= and &lt;= (or Between)." }, { re: /^between16&99$|^16-99$/, msg: "Use the word <b>And</b>: <code>Between 16 And 99</code>." }],
      why: "<code>Between 16 And 99</code> includes both ends. <code>&gt;=16 And &lt;=99</code> is the same thing." },
    { t: "text", mode: "expr", q: "Number of guests must be <b>at least 1</b>.", accept: [">=1", ">0"], show: ">=1",
      near: [{ re: /^>1$/, msg: "&gt;1 would reject 1 itself. 'At least' includes the number → &gt;=." }],
      why: "'At least 1' → <code>&gt;=1</code>. For whole numbers <code>&gt;0</code> does the same job." },
    { t: "text", mode: "expr", q: "Discount <b>cannot be more than 50</b>.", accept: ["<=50"], why: "'Not more than 50' means 50 is allowed → <code>&lt;=50</code>." },
    { t: "text", mode: "expr", q: "Star rating must be <b>from 1 to 5</b>.", accept: ["Between 1 And 5", ">=1 And <=5", "In (1,2,3,4,5)"], show: "Between 1 And 5", why: "<code>Between 1 And 5</code>." },
    { t: "text", mode: "expr", q: "Booking Date <b>cannot be in the past</b>.", accept: [">=Date()"], show: ">=Date()",
      near: [{ re: /^>date\(\)$/, msg: "&gt;Date() would reject today. 'Not in the past' allows today → &gt;=Date()." }, { re: /today/, msg: "Access uses the function <code>Date()</code> for today's date." }],
      why: "<code>Date()</code> is today. 'Not in the past' = today or later = <code>&gt;=Date()</code>." },
    { t: "text", mode: "expr", q: "Date of Birth must be <b>before today</b>.", accept: ["<Date()"], why: "<code>&lt;Date()</code>." },
    { t: "text", mode: "expr", q: "Hire Date must be <b>on or after 1 January 2026</b>.", accept: [">=#01/01/2026#", ">=#1/1/2026#", ">=#2026-01-01#"], show: ">=#01/01/2026#",
      near: [{ re: /^>=01\/01\/2026$/, msg: "Dates need hashes round them: <code>#01/01/2026#</code>." }, { re: /^>="01\/01\/2026"$/, msg: "Quotes are for text. Dates go between hashes: <code>#01/01/2026#</code>." }],
      why: "<code>&gt;=#01/01/2026#</code> – dates always between # symbols." },
    { t: "text", mode: "expr", q: "T-shirt Size must be <b>S, M or L</b> (write a Validation Rule).", accept: ["In (\"S\",\"M\",\"L\")", "\"S\" Or \"M\" Or \"L\"", "=\"S\" Or =\"M\" Or =\"L\"", "In (\"S\";\"M\";\"L\")"], show: "In (\"S\",\"M\",\"L\")",
      near: [{ re: /^in\(s,m,l\)$|^sorMorl$/i, msg: "Text values need double quotes: <code>\"S\"</code>." }],
      why: "<code>In (\"S\",\"M\",\"L\")</code>. (A Value List lookup with Limit To List = Yes is another valid way to do a list check.)" },
    { t: "text", mode: "expr", q: "Price must be <b>greater than zero</b>.", accept: [">0"], why: "<code>&gt;0</code>." },
    { t: "text", mode: "expr", q: "Session Start Time must be <b>between 09:00 and 21:00</b>.", accept: ["Between #09:00# And #21:00#", ">=#09:00# And <=#21:00#", "Between #9:00# And #21:00#", "Between #09:00:00# And #21:00:00#"], show: "Between #09:00# And #21:00#",
      why: "Times use hashes like dates: <code>Between #09:00# And #21:00#</code>." },
    { t: "text", mode: "expr", q: "Product Code must <b>start with the letter B</b>.", accept: ["Like \"B*\""], show: "Like \"B*\"",
      near: [{ re: /^="b\*"$|^"b\*"$/, msg: "Wildcards only work with <code>Like</code>: <code>Like \"B*\"</code>." }],
      why: "<code>*</code> means 'anything after'. Wildcards need <code>Like</code>." },
    { t: "text", mode: "expr", q: "Email must <b>contain an @ symbol</b>.", accept: ["Like \"*@*\"", "Like \"*@*.*\"", "Like \"?*@?*\"", "Like \"?*@?*.?*\""], show: "Like \"*@*\"",
      why: "<code>Like \"*@*\"</code> – anything, then @, then anything. <code>Like \"*@*.*\"</code> is even stricter (needs a dot after the @)." },

    { t: "mcq", q: "Which Validation Rule correctly means \"16 to 99, including 16 and 99\"?", opts: ["<code>&gt;16 And &lt;99</code>", "<code>Between 16 &amp; 99</code>", "<code>Between 16 And 99</code>", "<code>16-99</code>"], a: 2,
      why: "A leaves out 16 and 99. B uses &amp; instead of And. D isn't valid Access syntax." },
    { t: "mcq", q: "Which is the best <b>Validation Text</b> for the rule <code>&gt;=8</code> on Climber Age?", opts: ["Error!", "Invalid", "Climbers must be aged 8 or over – please re-enter the age", "&gt;=8"], a: 2,
      why: "Good validation text tells the user <b>what went wrong and what to enter</b>." },

    { t: "h", text: "Practise – input masks", sub: "Capital letters DO matter in input masks." },

    { t: "text", mode: "mask", q: "<b>Two capital letters followed by four digits</b>, e.g. AB1234.", accept: [">LL0000"], ph: "e.g. >L0", near: [{ re: /^LL0000$/, msg: "Nearly – add <code>&gt;</code> at the start to force capitals." }],
      why: "<code>&gt;</code> forces capitals, <code>LL</code> two required letters, <code>0000</code> four required digits." },
    { t: "text", mode: "mask", q: "Member ID is <b>the letter M followed by three digits</b>, e.g. M042.", accept: ["\\M000", "\"M\"000"], show: "\\M000",
      near: [{ re: /^>?L000$/, msg: "L accepts <i>any</i> letter. The M is fixed, so make it a literal: <code>\\M</code>." }, { re: /^M000$/, msg: "On its own, M isn't a mask character – put a backslash in front so it's shown literally: <code>\\M000</code>." }],
      why: "<code>\\M000</code>: the backslash makes the M a fixed character, then three required digits." },
    { t: "text", mode: "mask", q: "Phone number: <b>exactly 11 digits</b>.", accept: ["00000000000"], near: [{ re: /^0{10}$|^0{12}$/, msg: "Count again – you need exactly eleven 0s." }, { re: /^9{11}$/, msg: "9 means optional. 'Exactly 11' means all required → 0." }],
      why: "Eleven 0s – every digit required." },
    { t: "text", mode: "mask", q: "Course Code: <b>three capital letters</b>, e.g. ITA.", accept: [">LLL"], why: "<code>&gt;LLL</code>." },
    { t: "text", mode: "mask", q: "Climber ID: <b>the letters CL followed by three digits</b>, e.g. CL004.", accept: ["\\C\\L000", "\"CL\"000"], show: "\\C\\L000",
      near: [{ re: /^>?LL000$/, msg: "LL would accept any two letters. CL is fixed – use literals: <code>\\C\\L</code> (or <code>\"CL\"</code>)." }],
      why: "Each fixed letter needs its own backslash: <code>\\C\\L000</code>. Or put them in quotes: <code>\"CL\"000</code>." },
    { t: "text", mode: "mask", q: "Vehicle registration: <b>2 capital letters, 2 digits, a space, then 3 capital letters</b>, e.g. AB12 CDE.", accept: [">LL00 LLL", ">LL00\\ LLL", ">LL00\" \"LLL"], show: ">LL00 LLL",
      why: "<code>&gt;LL00 LLL</code>. The space is shown as part of the mask (you can also write it as <code>\\ </code>)." },
    { t: "text", mode: "mask", q: "Room number: <b>between one and three digits</b>, e.g. 7, 14 or 205.", accept: ["099", "0 99"], show: "099", hint: "The first digit is required; the others are optional.",
      why: "<code>0</code> required, then <code>99</code> optional." },

    { t: "mcq", q: "A student uses <code>&gt;L00</code> for 'the letter M followed by two digits'. What's the problem?", opts: ["Nothing – it's correct", "It would also accept other letters, e.g. Z55", "It makes the letter lower case", "It only allows one digit"], a: 1,
      why: "L means 'any letter'. Only a literal <code>\\M</code> forces the M." },
    { t: "mcq", q: "\"Quantity must be between 1 and 10.\" Which feature should you use?", opts: ["Input Mask <code>00</code>", "Validation Rule <code>Between 1 And 10</code>", "Field Size 10", "Required = Yes"], a: 1,
      why: "That's a range. An input mask could only control how many digits, not the value – 00 would still accept 99." },
